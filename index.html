<!DOCTYPE html>
<html lang="ru">
<head>

<style>
.top-actions{position:relative;width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.settings-button,.admin-panel-button{min-height:40px;padding:9px 15px;border:1px solid rgba(255,255,255,.22);border-radius:11px;color:#fffaf5;font-family:Arial,sans-serif;font-size:14px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 5px 14px rgba(55,38,25,.18);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;display:inline-flex;align-items:center;gap:6px}
.settings-button{position:absolute;right:0;top:50%;transform:translateY(-50%);width:42px;height:42px;min-width:42px;min-height:42px;padding:0;border-radius:50%;font-size:0;line-height:1;justify-content:center;background:linear-gradient(135deg,#a77a58 0%,#c4936b 48%,#dfb184 100%);background-size:180% 180%;animation:settingsGradient 5s ease infinite}
.settings-button:hover{transform:translateY(-50%) translateY(-1px) scale(1.03);box-shadow:0 7px 18px rgba(55,38,25,.28);filter:brightness(1.08)}
.settings-button .settings-icon-svg{display:block;width:25px;height:25px;flex:none;overflow:visible;transform:rotate(0deg);transition:transform .22s ease;filter:drop-shadow(0 1px 1px rgba(20,10,4,.8)) drop-shadow(0 0 3px rgba(190,83,28,.45))}
.settings-button:hover .settings-icon-svg{transform:rotate(28deg)}
.settings-button:active .settings-icon-svg{transform:rotate(180deg) scale(.94)}
.settings-button .settings-icon-svg.settings-spin{animation:settingsGearSpin .34s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes settingsGearSpin{0%{transform:rotate(0) scale(1)}70%{transform:rotate(205deg) scale(.92)}100%{transform:rotate(180deg) scale(1)}}
.admin-panel-button{position:absolute;left:0;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,#263238 0%,#405b73 45%,#7661a8 100%);background-size:180% 180%;animation:adminGradient 5s ease infinite}
.admin-panel-button:hover{transform:translateY(-50%) translateY(-1px) scale(1.03);box-shadow:0 7px 18px rgba(55,55,85,.25);filter:brightness(1.08)}
@keyframes settingsGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes adminGradient{0%,100%{background-position:100% 50%}50%{background-position:0% 50%}}
@media(max-width:700px){.top-actions{min-height:42px;margin-bottom:2px}.settings-button,.admin-panel-button{min-height:38px;padding:8px 12px;font-size:13px;border-radius:10px}.settings-button{width:44px;height:44px;min-width:44px;min-height:44px;padding:0;font-size:0;border-radius:50%;right:0;left:auto}.settings-button .settings-icon-svg{width:23px;height:23px}.admin-panel-button{left:0;right:auto}}
@media(max-width:380px){.settings-button,.admin-panel-button{padding:8px 10px;font-size:12px}.settings-button{width:44px;height:44px;min-width:44px;min-height:44px;padding:0;font-size:0;border-radius:50%}.chat-header-actions{gap:5px}.leave-chat-button{padding:7px 9px;font-size:12px;border-radius:8px}.chat-call-button{width:40px!important;height:40px!important;font-size:18px!important}}

.coin-1c{position:absolute;left:50%;top:calc(50% + 20px);width:190px;height:190px;margin:0;display:block;perspective:800px;transform:translate(-50%,-50%) scale(.64);transform-origin:center center;z-index:10}
.coin-body{position:absolute;top:10px;left:10px;width:170px;height:170px;border-radius:50%;transform-style:preserve-3d;animation:coinMotion 5s linear infinite}
.coin-depth{position:absolute;top:0;left:0;width:170px;height:170px;border-radius:50%;box-sizing:border-box;background:repeating-linear-gradient(90deg,#704700 0px,#9a6300 1px,#d39400 2px,#f1bd32 3px,#ffe06a 4px,#e7aa18 5px,#b87500 6px,#805000 7px);border:7px solid #b77a00;box-shadow:inset 0 0 3px rgba(255,250,180,.75),inset 0 2px 2px rgba(255,235,110,.55),inset 0 -2px 4px rgba(50,25,0,.55)}
.coin-depth-1{transform:translateZ(-5.5px)}.coin-depth-2{transform:translateZ(-4.95px)}.coin-depth-3{transform:translateZ(-4.4px)}.coin-depth-4{transform:translateZ(-3.85px)}.coin-depth-5{transform:translateZ(-3.3px)}.coin-depth-6{transform:translateZ(-2.75px)}.coin-depth-7{transform:translateZ(-2.2px)}.coin-depth-8{transform:translateZ(-1.65px)}.coin-depth-9{transform:translateZ(-1.1px)}.coin-depth-10{transform:translateZ(-.55px)}.coin-depth-11{transform:translateZ(0)}.coin-depth-12{transform:translateZ(.55px)}.coin-depth-13{transform:translateZ(1.1px)}.coin-depth-14{transform:translateZ(1.65px)}.coin-depth-15{transform:translateZ(2.2px)}.coin-depth-16{transform:translateZ(2.75px)}.coin-depth-17{transform:translateZ(3.3px)}.coin-depth-18{transform:translateZ(3.85px)}.coin-depth-19{transform:translateZ(4.4px)}.coin-depth-20{transform:translateZ(4.95px)}.coin-depth-21{transform:translateZ(5.5px)}
.coin-face{position:absolute;top:0;left:0;width:170px;height:170px;border-radius:50%;box-sizing:border-box;display:flex;justify-content:center;align-items:center;backface-visibility:hidden;overflow:hidden}
.coin-front,.coin-back{font-size:88px;font-weight:900;font-family:Arial,sans-serif;color:#fff9cf;letter-spacing:-6px;text-shadow:0 2px 0 #8a5b00,0 4px 7px rgba(65,35,0,.72),0 0 12px rgba(255,255,190,.95),0 0 2px rgba(255,255,255,.9);border:10px solid transparent;background:radial-gradient(circle at 31% 24%,rgba(255,255,230,.98) 0%,rgba(255,247,180,.92) 4%,rgba(255,226,90,.85) 10%,rgba(255,205,45,.38) 17%,transparent 25%),radial-gradient(circle at 50% 50%,#ffe16a 0%,#f7cc3b 14%,#efbd20 28%,#dda40e 43%,#c88905 58%,#a96d00 72%,#875300 86%,#603a00 100%) padding-box,repeating-conic-gradient(from 0deg,#fff6b0 0deg 2deg,#c98b00 2deg 4deg,#ffe06a 4deg 6deg,#a86e00 6deg 8deg) border-box;box-shadow:inset 0 5px 5px rgba(255,255,255,.95),inset 0 -8px 14px rgba(45,22,0,.38),inset 4px 0 8px rgba(255,235,120,.65),inset -3px 0 7px rgba(120,65,0,.28),0 0 12px rgba(255,215,40,.5),0 0 28px rgba(255,193,7,.3);isolation:isolate}
.coin-front{transform:translateZ(6px)}.coin-back{transform:translateZ(-6px) rotateY(180deg)}
.coin-front::before,.coin-back::before{content:"";position:absolute;inset:9px;border-radius:50%;border:3px solid rgba(255,240,145,.95);box-shadow:inset 0 2px 3px rgba(255,255,255,.85),inset 0 -4px 6px rgba(80,40,0,.4),0 0 3px rgba(255,255,255,.95),0 0 8px rgba(255,220,80,.35);pointer-events:none;z-index:2}
.coin-front::after,.coin-back::after{content:"";position:absolute;top:-55%;left:-130%;width:38%;height:210%;background:linear-gradient(120deg,transparent 0%,transparent 30%,rgba(255,255,255,.05) 36%,rgba(255,255,255,.35) 42%,rgba(255,255,255,1) 48%,rgba(255,255,255,1) 50%,rgba(255,255,255,.65) 53%,rgba(255,255,255,.18) 58%,transparent 66%,transparent 100%);transform:rotate(20deg) scaleX(1.15);filter:blur(.2px) drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 0 20px rgba(255,240,160,.85)) drop-shadow(0 0 35px rgba(255,220,80,.5));animation:coinShine 2.8s cubic-bezier(.2,.5,.3,1) infinite;pointer-events:none;z-index:4}
.coin-1c{filter:drop-shadow(0 0 15px rgba(255,215,0,.6)) drop-shadow(0 0 30px rgba(255,193,7,.35)) drop-shadow(0 0 55px rgba(255,225,100,.18))}
.coin-one{font-family:Arial,sans-serif;font-size:88px;font-weight:900;line-height:1;color:#fff9cf;text-shadow:0 2px 0 #8a6200,0 4px 7px rgba(80,45,0,.7),0 0 12px rgba(255,255,190,.95),0 0 3px rgba(255,255,255,.8);position:relative;display:inline-block}.coin-one::before,.coin-one::after{content:"";position:absolute;top:-3px;bottom:-3px;width:9px;background:#fff8c7;border-radius:0;box-shadow:0 1px 0 #8a6200;opacity:1;filter:none;pointer-events:none;z-index:5;box-sizing:border-box}.coin-one::before{left:calc(50% - 9px);border-right:1px solid #b77a00}.coin-one::after{left:50%;border-left:1px solid #b77a00}
.coin-s{font-family:Arial,sans-serif;font-size:88px;font-weight:900;line-height:1;margin-left:-1px;margin-top:0;color:#fff8c7;text-shadow:0 2px 0 #8a6200,0 3px 6px rgba(80,45,0,.7),0 0 10px rgba(255,255,190,.9)}
@keyframes coinMotion{0%{transform:perspective(800px) translateY(0) rotateY(0deg)}25%{transform:perspective(800px) translateY(-7px) rotateY(90deg)}50%{transform:perspective(800px) translateY(0) rotateY(180deg)}75%{transform:perspective(800px) translateY(7px) rotateY(270deg)}100%{transform:perspective(800px) translateY(0) rotateY(360deg)}}
@keyframes coinShine{0%{left:-130%;opacity:0}8%{opacity:.15}18%{opacity:1}35%{opacity:1}48%{opacity:.9}58%{opacity:.35}70%{opacity:0}100%{left:190%;opacity:0}}

.chat-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.chat-header-main-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.chat-call-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:nowrap}
.leave-chat-button{display:none;padding:6px 11px;background:#8b5a3c;color:white;border:none;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:background .2s ease,transform .15s ease;align-items:center;gap:5px}
.leave-chat-button:hover{background:#6f452e;transform:translateY(-1px)}

.chat-header-actions .chat-call-button{display:flex!important;width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;padding:0!important;border:1px solid rgba(255,255,255,.72)!important;border-radius:50%!important;align-items:center!important;justify-content:center!important;color:#fff!important;box-shadow:0 3px 10px rgba(35,25,18,.18)!important;cursor:pointer!important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease!important}
.chat-header-actions .chat-call-button:hover{transform:translateY(-1px) scale(1.04)!important;box-shadow:0 5px 13px rgba(35,25,18,.24)!important;filter:brightness(1.05)!important}
.chat-header-actions .chat-call-button:active{transform:scale(.96)!important;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)!important}
.chat-header-actions .chat-call-audio{background:#6eae83!important;color:#f7fff9!important}
.chat-header-actions .chat-call-video{background:#a96d6d!important;color:#fffaf8!important}

/* ===== ТЕЛЕФОН — своя картинка ===== */
.chat-header-actions .call-icon-phone{position:relative;display:block;width:22px!important;height:22px!important;margin:0 auto!important;background:transparent!important}
.chat-header-actions .call-icon-phone:before{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%) rotate(-20deg);background:url("phone-handset.svg") no-repeat center / contain}
.chat-header-actions .call-icon-phone:after{content:none!important}

/* ===== ВИДЕОКАМЕРА — без изменений ===== */
.chat-header-actions .call-icon-video{position:relative;display:block;width:15px!important;height:10px!important;border:0!important;border-radius:2.5px!important;background:#edf0f2!important;box-sizing:border-box;margin:0 auto!important;transform:translateX(2px)}
.chat-header-actions .call-icon-video:after{content:"";position:absolute;left:auto!important;right:-5px!important;top:1px!important;width:6px!important;height:8px!important;border:0!important;background:#edf0f2!important;clip-path:polygon(0 0, 0 100%, 100% 50%)!important;box-sizing:border-box}

@media(max-width:700px){
.chat-header-actions{width:100%;align-items:flex-end;justify-content:flex-end;gap:8px;flex-direction:column;flex-wrap:nowrap}
.chat-header-main-actions{width:100%;justify-content:flex-end;align-items:center;gap:6px}
.chat-call-actions{width:100%;justify-content:flex-end;align-items:center;gap:10px;min-height:44px}
.chat-header-actions .chat-call-button{width:46px!important;height:46px!important;min-width:46px!important;min-height:46px!important}
}
@media(max-width:380px){
.chat-header-actions{gap:7px}
.chat-header-actions .chat-call-button{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important}
.chat-call-actions{gap:8px}
}
.icon-svg{display:inline-block;vertical-align:middle;flex-shrink:0}

/* ===== СПИСОК ЧАТОВ — кнопка нового чата ===== */
.chat-list-header{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-width:0;margin:0 0 12px}
.chat-list-header h2{margin:2px 4px!important;min-width:0}
.chat-list-new-chat{position:relative;flex:0 0 auto}
@keyframes metalCellDrift{0%,100%{background-position:0 0,0 0,0 0}50%{background-position:32px 24px,-32px -24px,0 0}}
body{background-color:#92999d!important;background-image:linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(0deg,rgba(35,42,46,.10) 1px,transparent 1px),linear-gradient(145deg,#aeb5b9 0%,#929a9f 48%,#a3aaae 100%)!important;background-size:64px 48px,64px 48px,100% 100%!important;animation:metalCellDrift 28s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){body{animation:none!important}}
.chat-list{background:#6b310f!important}
.chat-list h2{color:#fff!important}
#chatTitle{color:#fffefa!important}
.chat-list-new-chat #newChatButton{padding:5px 8px;background:#6b310f;color:white;border:none;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:background .2s ease,transform .15s ease;display:inline-flex;align-items:center;gap:4px}
.chat-list-new-chat #newChatButton:hover{background:#54260c;transform:translateY(-1px)}
.chat-list-new-chat #newChatMenu{top:34px!important;right:0!important;left:auto!important}
#newChatMenu{background:#111!important;border:1px solid #555!important}
#newChatMenu button{background:#111!important;color:#fff!important}
#newChatMenu button:hover{background:#292929!important;color:#fff!important}

/* ===== ANDROID / МОБИЛЬНЫЕ — такие же круглые углы, как на iPhone ===== */
@media(max-width:900px){
    body:not(.mobile-chat-open) .chat-list{border-radius:26px!important}
}

@media(max-width:380px){
    .chat-list-header{gap:6px;margin-bottom:10px}
    .chat-list-header h2{font-size:17px!important}
    .chat-list-new-chat #newChatButton{padding:5px 7px;font-size:10px}
}
</style>
<script>
(function(){
    "use strict";
    var KEY="chatExternalTheme";
    var themes={
        "metal-classic":{
            color:"#92999d",
            image:"linear-gradient(145deg,#aeb5b9 0%,#929a9f 48%,#a3aaae 100%)",
            size:"100% 100%",
            animation:"none"
        },
        "metal-grid":{
            color:"#92999d",
            image:"linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(0deg,rgba(35,42,46,.10) 1px,transparent 1px),linear-gradient(145deg,#aeb5b9 0%,#929a9f 48%,#a3aaae 100%)",
            size:"64px 48px,64px 48px,100% 100%",
            animation:"externalMetalGrid 28s ease-in-out infinite"
        },
        "metal-large":{
            color:"#92999d",
            image:"linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(0deg,rgba(35,42,46,.12) 1px,transparent 1px),linear-gradient(145deg,#aeb5b9 0%,#929a9f 48%,#a3aaae 100%)",
            size:"128px 96px,128px 96px,100% 100%",
            animation:"externalMetalLarge 36s ease-in-out infinite"
        },
        "gold-shine":{
            color:"#b58a35",
            image:"linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.38) 25%,rgba(255,255,255,.08) 48%,rgba(112,70,0,.10) 75%,rgba(255,255,255,.12) 100%),radial-gradient(circle at 20% 30%,rgba(255,255,255,.34) 0 2px,transparent 3px),linear-gradient(135deg,#8a641e 0%,#d9bd70 25%,#f7d774 50%,#fff3bd 70%,#b17a1f 100%)",
            size:"260% 260%,120px 120px,100% 100%",
            animation:"externalGoldShine 30s ease-in-out infinite"
        },
        "gold-large":{
            color:"#b58a35",
            image:"linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.38) 25%,rgba(255,255,255,.08) 48%,rgba(112,70,0,.10) 75%,rgba(255,255,255,.12) 100%),repeating-conic-gradient(rgba(255,247,205,.25) 0% 25%,transparent 0% 50%),repeating-conic-gradient(rgba(92,55,0,.20) 0% 25%,transparent 0% 50%),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(0deg,rgba(92,55,0,.16) 1px,transparent 1px),linear-gradient(135deg,#8a641e 0%,#d9bd70 25%,#f7d774 50%,#fff3bd 70%,#b17a1f 100%)",
            size:"260% 260%,256px 192px,256px 192px,128px 96px,128px 96px,100% 100%",
            animation:"externalGoldCells 20s ease-in-out infinite"
        },
        "gold-large-original":{
            color:"#b58a35",
            image:"linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.38) 25%,rgba(255,255,255,.08) 48%,rgba(112,70,0,.10) 75%,rgba(255,255,255,.12) 100%),repeating-conic-gradient(rgba(255,247,205,.25) 0% 25%,transparent 0% 50%),repeating-conic-gradient(rgba(92,55,0,.20) 0% 25%,transparent 0% 50%),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(0deg,rgba(92,55,0,.16) 1px,transparent 1px),linear-gradient(135deg,#8a641e 0%,#d9bd70 25%,#f7d774 50%,#fff3bd 70%,#b17a1f 100%)",
            size:"260% 260%,256px 192px,256px 192px,128px 96px,128px 96px,100% 100%",
            animation:"externalGoldCellsOriginal 20s ease-in-out infinite"
        },
        "metal-small-cells":{
            color:"#92999d",
            image:"linear-gradient(115deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.42) 25%,rgba(255,255,255,.10) 48%,rgba(35,42,46,.12) 75%,rgba(255,255,255,.16) 100%),repeating-conic-gradient(rgba(245,250,252,.26) 0% 25%,transparent 0% 50%),repeating-conic-gradient(rgba(35,42,46,.18) 0% 25%,transparent 0% 50%),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(0deg,rgba(35,42,46,.16) 1px,transparent 1px),linear-gradient(145deg,#69747a 0%,#cbd1d4 25%,#929da2 50%,#e9edef 70%,#737e83 100%)",
            size:"260% 260%,256px 192px,256px 192px,128px 96px,128px 96px,100% 100%",
            animation:"externalMetalCellsSmall 20s ease-in-out infinite"
        },
        "metal-large-cells":{
            color:"#92999d",
            image:"linear-gradient(115deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.42) 25%,rgba(255,255,255,.10) 48%,rgba(35,42,46,.12) 75%,rgba(255,255,255,.16) 100%),repeating-conic-gradient(rgba(245,250,252,.26) 0% 25%,transparent 0% 50%),repeating-conic-gradient(rgba(35,42,46,.18) 0% 25%,transparent 0% 50%),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(0deg,rgba(35,42,46,.16) 1px,transparent 1px),linear-gradient(145deg,#69747a 0%,#cbd1d4 25%,#929da2 50%,#e9edef 70%,#737e83 100%)",
            size:"260% 260%,256px 192px,256px 192px,128px 96px,128px 96px,100% 100%",
            animation:"externalMetalCellsLarge 20s ease-in-out infinite"
        }
    };
    var style=document.createElement("style");
    style.id="chatExternalThemeMotion";
    style.textContent="@keyframes externalMetalGrid{0%,100%{background-position:0 0,0 0,0 0}50%{background-position:32px 24px,-32px -24px,0 0}}"+
        "@keyframes externalMetalLarge{0%,100%{background-position:0 0,0 0,0 0}50%{background-position:64px 48px,-64px -48px,0 0}}"+
        "@keyframes externalGoldShine{0%,100%{background-position:0% 50%,0 0,0 0}50%{background-position:100% 50%,40px 30px,0 0}}"+"@keyframes externalGoldCells{0%,100%{background-position:0% 50%,0 0,128px 96px,0 0,0 0,0 0;background-size:260% 260%,256px 192px,256px 192px,128px 96px,128px 96px,100% 100%}50%{background-position:100% 50%,128px 96px,0 0,0 0,0 0,0 0;background-size:260% 260%,288px 216px,224px 168px,128px 96px,128px 96px,100% 100%}}"+"@keyframes externalGoldCellsOriginal{0%,100%{background-position:0% 50%,0 0,128px 96px,0 0,0 0,0 0}50%{background-position:100% 50%,128px 96px,0 0,0 0,0 0}}"+
        "@keyframes externalMetalCellsSmall{0%,100%{background-position:0% 50%,0 0,128px 96px,0 0,0 0,0 0}50%{background-position:100% 50%,128px 96px,0 0,0 0,0 0}}"+
        "@keyframes externalMetalCellsLarge{0%,100%{background-position:0% 50%,0 0,128px 96px,0 0,0 0,0 0;background-size:260% 260%,256px 192px,256px 192px,128px 96px,128px 96px,100% 100%}50%{background-position:100% 50%,128px 96px,0 0,0 0,0 0,0 0;background-size:260% 260%,288px 216px,224px 168px,128px 96px,128px 96px,100% 100%}}";
    document.head.appendChild(style);
    function apply(){
        var id=localStorage.getItem(KEY)||"metal-grid";
        var theme=themes[id]||themes["metal-grid"];
        var body=document.body;
        body.style.setProperty("background-color",theme.color,"important");
        body.style.setProperty("background-image",theme.image,"important");
        var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if((id==="gold-large"||id==="metal-large-cells")&&!reduced)body.style.removeProperty("background-size");
        else body.style.setProperty("background-size",theme.size,"important");
        body.style.setProperty("animation",reduced?"none":theme.animation,"important");
    }

<script>
(function arrangeCallButtons(){
    function moveButtons(){
        const actions=document.getElementById("chatCallActions");
        const header=document.querySelector(".chat-header-actions");
        if(!actions || !header) return;
        header.querySelectorAll(":scope > .chat-call-button").forEach(button=>actions.appendChild(button));
        header.querySelectorAll(":scope > button.chat-call-button, :scope > div > .chat-call-button").forEach(button=>{
            if(button.parentElement!==actions) actions.appendChild(button);
        });
    }
    moveButtons();
    const observer=new MutationObserver(moveButtons);
    observer.observe(document.body,{childList:true,subtree:true});
})();
</script>
<script>
(async function showAdminButton(){
    const adminButton=document.getElementById("adminPanelButton");
    if(!adminButton)return;
    const {data:{user},error:userError}=await supabaseClient.auth.getUser();
    if(userError||!user)return;
    const {data:profiles,error:profileError}=await supabaseClient.rpc("check_my_profile");
    const profile=profiles&&profiles[0]?profiles[0]:null;
    if(profileError||!profile||(profile.role!=="admin"&&profile.role!=="superadmin")||profile.approved!==true)return;
    adminButton.style.display="inline-flex";
})();
</script>
