<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5a4636">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="chat-mobile.css">
<style>
.top-actions{position:relative;width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}.logout-button,.admin-panel-button{min-height:40px;padding:9px 15px;border:1px solid rgba(255,255,255,.22);border-radius:11px;color:#fffaf5;font-family:Arial,sans-serif;font-size:14px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 5px 14px rgba(55,38,25,.18);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}.logout-button{position:absolute;right:0;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,#211a16 0%,#5b3d2b 48%,#9a6a43 100%);background-size:180% 180%;animation:logoutGradient 5s ease infinite}.logout-button:hover{transform:translateY(-50%) translateY(-1px) scale(1.03);box-shadow:0 7px 18px rgba(55,38,25,.28);filter:brightness(1.08)}.admin-panel-button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#263238 0%,#405b73 45%,#7661a8 100%);background-size:180% 180%;animation:adminGradient 5s ease infinite}.admin-panel-button:hover{transform:translate(-50%,-50%) translateY(-1px) scale(1.03);box-shadow:0 7px 18px rgba(55,55,85,.25);filter:brightness(1.08)}@keyframes logoutGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@keyframes adminGradient{0%,100%{background-position:100% 50%}50%{background-position:0% 50%}}@media(max-width:700px){.top-actions{min-height:42px;margin-bottom:2px}.logout-button,.admin-panel-button{min-height:38px;padding:8px 12px;font-size:13px;border-radius:10px}.admin-panel-button{left:50%;right:auto}.logout-button{right:0;left:auto}}@media(max-width:380px){.logout-button,.admin-panel-button{padding:8px 10px;font-size:12px}.chat-header-actions{gap:5px}.leave-chat-button{padding:7px 9px;font-size:12px;border-radius:8px}.chat-call-button{width:40px!important;height:40px!important;font-size:18px!important}}

/* =========================================
   Верхняя панель чата
   ========================================= */
.chat-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.chat-header-main-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.chat-call-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:nowrap}.leave-chat-button{display:none;padding:4px 8px;background:#8b5a3c;color:white;border:none;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:background .2s ease,transform .15s ease}.leave-chat-button:hover{background:#6f452e;transform:translateY(-1px)}

/* Кнопки звонков: круглые, заметные, но без ядовитых цветов. */
.chat-header-actions .chat-call-button{display:flex!important;width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;padding:0!important;border:1px solid rgba(255,255,255,.72)!important;border-radius:50%!important;align-items:center!important;justify-content:center!important;color:#fff!important;box-shadow:0 3px 10px rgba(35,25,18,.18)!important;cursor:pointer!important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease!important}
.chat-header-actions .chat-call-button:hover{transform:translateY(-1px) scale(1.04)!important;box-shadow:0 5px 13px rgba(35,25,18,.24)!important;filter:brightness(1.05)!important}
.chat-header-actions .chat-call-button:active{transform:scale(.96)!important;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)!important}
.chat-header-actions .chat-call-audio{background:#6eae83!important;color:#f7fff9!important}
.chat-header-actions .chat-call-video{background:#a96d6d!important;color:#fffaf8!important}

/* Уникальная CSS-форма классической телефонной трубки. */
.chat-header-actions .call-icon-phone{position:relative;display:block;width:23px!important;height:24px!important;margin:0!important;font-size:0!important;line-height:0!important;transform:rotate(-42deg)!important}
.chat-header-actions .call-icon-phone:before{content:"";position:absolute;left:5px;top:2px;width:13px;height:20px;border:5px solid currentColor;border-top-color:transparent;border-bottom-color:transparent;border-radius:10px;box-sizing:border-box}
.chat-header-actions .call-icon-phone:after{content:"";position:absolute;left:2px;top:1px;width:9px;height:8px;background:currentColor;border-radius:3px 2px 4px 2px;box-shadow:12px 14px 0 currentColor}

/* Камера: прямоугольный корпус, треугольник справа и остриём к корпусу. */
.chat-header-actions .call-icon-video{position:relative;display:block;width:18px!important;height:13px!important;border:0!important;border-radius:3px!important;background:#edf0f2!important;box-sizing:border-box}
.chat-header-actions .call-icon-video:after{content:"";position:absolute;left:auto!important;right:-7px!important;top:2px!important;width:0;height:0;border-top:4.5px solid transparent!important;border-bottom:4.5px solid transparent!important;border-right:7px solid #edf0f2!important;border-left:0!important}

@media(max-width:700px){
    .chat-header-actions{width:100%;align-items:flex-end;justify-content:flex-end;gap:8px;flex-direction:column;flex-wrap:nowrap}
    .chat-header-main-actions{width:100%;justify-content:flex-end;align-items:center;gap:6px}
    .chat-call-actions{width:100%;justify-content:flex-end;align-items:center;gap:10px;min-height:44px}
    .chat-header-actions .chat-call-button{width:46px!important;height:46px!important;min-width:46px!important;min-height:46px!important}
}
@media(max-width:380px){
    .chat-header-actions{gap:7px}
    .chat-header-actions .chat-call-button{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important}
    .chat-call-actions{gap:8px}
}
</style>
</head>
<body>
<div class="top-actions"><button id="adminPanelButton" class="admin-panel-button" onclick="window.location.href='admin.html'" style="display:none;">⚙ Админ-панель</button><button onclick="logout()" class="logout-button">🚪 Выйти</button></div>
<h1 align="center">💬 Чат</h1>
<div class="chat-container"><div class="chat-list"><h2>Чаты</h2><div id="chatList"></div></div><div class="chat-window"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><h2 id="chatTitle" style="margin:0;">Выберите чат</h2><div class="chat-header-actions"><div class="chat-header-main-actions"><button id="leaveChatButton" class="leave-chat-button" type="button">🚪 Выйти из чата</button><div style="position:relative;"><button id="newChatButton" style="padding:4px 7px;background:#ff9800;color:white;border:none;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:background .2s ease,transform .15s ease;">➕ Новый чат</button><div id="newChatMenu" style="display:none;position:absolute;right:0;top:32px;z-index:1000;background:white;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden;min-width:160px;"><button id="newPrivateChatMenuButton" style="display:block;width:100%;padding:10px;border:none;background:white;text-align:left;cursor:pointer;">🔒 Личный чат</button><button id="newGroupChatMenuButton" style="display:block;width:100%;padding:10px;border:none;background:white;text-align:left;cursor:pointer;">👥 Групповой чат</button></div></div></div><div id="chatCallActions" class="chat-call-actions"></div></div></div><div id="messages"></div><div id="typingIndicator" style="display:none;color:#777;font-style:italic;margin:10px;"></div><div class="send-box"><div style="display:flex;flex-direction:column;width:100%;"><div id="replyBox" style="display:none;background:#eeeeee;padding:8px;border-left:4px solid #8E44AD;border-radius:6px;margin-bottom:5px;font-size:14px;"><span id="replyText"></span><button onclick="cancelReply()" style="float:right;border:none;background:none;cursor:pointer;color:red;font-weight:bold;">❌</button></div><input id="messageInput" type="text" placeholder="Введите сообщение..."></div><button id="sendButton" title="Отправить сообщение">✈</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth-check.js"></script><script src="logout.js"></script><audio id="messageSound" src="message.mp3"></audio>
<script src="01-chat-state.js"></script><script src="02-chat-user.js"></script><script src="03-chat-list.js"></script><script src="04-chat-private.js"></script><script src="05-chat-messages.js"></script><script src="14-chat-message-render.js"></script><script src="15-chat-scroll.js"></script><script src="06-chat-send.js"></script><script src="07-chat-read.js"></script><script src="08-chat-realtime.js"></script><script src="17-chat-order.js"></script><script src="09-chat-unread.js"></script><script src="10-chat-typing.js"></script><script src="11-chat-reply.js"></script><script src="16-chat-actions.js"></script><script src="12-chat-init.js"></script><script src="13-chat-sound.js"></script><script src="push.js"></script><script src="call-v2-media-fix.js"></script><script src="call-v2.js"></script><script src="call-v2-controls-fix.js"></script><script src="call-v2-chat-order.js"></script><script src="call-v2-ringtone.js"></script>
<script>
/* Перенос динамических кнопок звонка в отдельную строку.
   События уже назначены call-v2.js, поэтому перенос DOM их не ломает. */
(function arrangeCallButtons(){
    function moveButtons(){
        const actions=document.getElementById("chatCallActions");
        const header=document.querySelector(".chat-header-actions");
        if(!actions || !header) return;
        header.querySelectorAll(":scope > .chat-call-button").forEach(button=>actions.appendChild(button));
        header.querySelectorAll(":scope > button.chat-call-button, :scope > div > .chat-call-button").forEach(button=>{
            if(button.parentElement!==actions) actions.appendChild(button);
        });
    }
    moveButtons();
    const observer=new MutationObserver(moveButtons);
    observer.observe(document.body,{childList:true,subtree:true});
})();
</script>
<script>(async function showAdminButton(){const adminButton=document.getElementById("adminPanelButton");if(!adminButton)return;const {data:{user},error:userError}=await supabaseClient.auth.getUser();if(userError||!user)return;const {data:profile,error:profileError}=await supabaseClient.from("profiles").select("role, approved").eq("id",user.id).maybeSingle();if(profileError||!profile||profile.role!=="admin"||profile.approved!==true)return;adminButton.style.display="inline-block";})();</script>
</body>
</html>
