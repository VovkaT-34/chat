<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>👁️ Глаз Бога</title><style>body{font-family:Arial;background:#201820;color:#fff;margin:0;padding:16px}.p{max-width:1000px;margin:auto}input,button{padding:12px;border-radius:10px;border:1px solid #555;background:#302530;color:#fff}input{width:70%;font-size:16px}.go{background:#8b3657;font-weight:bold}.r{margin-top:16px}.item{padding:12px;border-bottom:1px solid #493d49}.item a{color:#f0a5bd;font-weight:bold}.url{display:block;color:#aaa;font-size:12px;word-break:break-all;margin-top:5px}</style></head><body><main class="p"><button onclick="location.href='games.html'">← Игры</button><h1>👁️ Глаз Бога</h1><p>Результаты собираются здесь. Поисковики не открываются.</p><input id="q" placeholder="ФИО, username, телефон, VIN, госномер, email, домен, IP"><button class="go" onclick="go()">⚡ Быстрый поиск</button><div id="s"></div><div id="r" class="r"></div></main><script>const API='https://sxkukrqjtgkxmzuzondm.supabase.co/functions/v1/osint-public',q=document.getElementById('q'),s=document.getElementById('s'),r=document.getElementById('r');function normalizeUrl(v){try{v=String(v||'').replace(/&amp;/g,'&');const x=new URL(v);const bu=x.searchParams.get('u');if(x.hostname.includes('bing.com')&&x.pathname==='/ck/a'&&bu){const raw=bu.startsWith('a1')?bu.slice(2):bu;const p=raw.replace(/-/g,'+').replace(/_/g,'/');const b=atob(p+'='.repeat((4-p.length%4)%4));if(/^https?:\/\//i.test(b))return b}const q=x.searchParams.get('q');if(x.pathname==='/url'&&q)return decodeURIComponent(q);const uddg=x.searchParams.get('uddg');if(uddg)return decodeURIComponent(uddg);return /^https?:$/i.test(x.protocol)?x.href:''}catch{return''}}async function go(){const v=q.value.trim();if(!v)return;s.textContent='⚡ Идёт поиск по публичным источникам…';r.innerHTML='';try{const qs=[`"${v}"`,`"${v}" (site:vk.com OR site:ok.ru OR site:t.me OR site:linkedin.com OR site:facebook.com OR site:instagram.com OR site:x.com OR site:youtube.com)`,`"${v}" (site:github.com OR site:reddit.com OR site:t.me OR site:instagram.com OR site:tiktok.com OR site:x.com OR site:twitch.tv OR site:gitlab.com)`,`"${v}" (VIN OR госномер OR автомобиль OR машина OR авто)`,`"${v}" (email OR почта OR контакт)`];const a=await Promise.all(qs.map(x=>fetch(API+'?type=search&q='+encodeURIComponent(x)).then(x=>x.ok?x.json():null).catch(()=>null)));const seen=new Set();let n=0;a.forEach(d=>(d?.results||[]).forEach(x=>{const u=normalizeUrl(x.url);if(!u||seen.has(u))return;seen.add(u);n++;const row=document.createElement('div');row.className='item';const link=document.createElement('a');link.href=u;link.target='_self';link.rel='noopener noreferrer';link.textContent=x.title||u;row.append((x.source||'Источник')+' · ',link);const raw=document.createElement('span');raw.className='url';raw.textContent=u;row.appendChild(raw);r.appendChild(row)}));s.textContent='⚡ Готово. Уникальных результатов: '+n+'.';}catch(e){s.textContent='Ошибка поиска: '+e.message}}q.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
