<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>🪖 Танчики</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="game-tanchiki.css">
  <script src="auth-check.js"></script>
</head>
<body>
  <div class="page">
    <div class="top">
      <button class="back" onclick="location.href='games.html'">← Игры</button>
      <h1 class="title">🪖 Танчики</h1>
      <span id="tankScore" class="score">0</span>
    </div>
    <div id="tankBoard" class="tank-board"></div>
    <div class="tank-controls">
      <button class="mobile-pause pause-btn tank-pause" onclick="toggleTankPause()">Пауза</button>
      <button class="ctrl up" data-tank="up">▲</button>
      <button class="ctrl left" data-tank="left">◀</button>
      <button class="ctrl down" data-tank="down">▼</button>
      <button class="ctrl right" data-tank="right">▶</button>
    </div>
    <p class="hint desktop-hint">Компьютер: стрелки — управление танком · Пробел — пауза</p>
  </div>
  <script>var activeGame='tanks';</script>
  <script src="game-tanchiki.js"></script>
  <script>startTanks();document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();toggleTankPause();return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();moveTank(e.code.replace('Arrow','').toLowerCase())}});</script>
</body>
</html>
