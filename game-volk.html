<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#172b20">
<title>🐺 Ну, погоди!</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="game-volk.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="auth-check.js"></script>
</head>
<body>
<main class="volk-page">
  <header class="volk-top">
    <button class="back" type="button" onclick="location.href='games.html'">← Игры</button>
    <h1 style="display:flex;align-items:center;gap:8px"><img src="wolf-full.svg" alt="Мультяшный волк" width="44" height="44" style="object-fit:contain"> Ну, погоди!</h1>
    <div class="mode-picker"><button id="modeToggle" class="mode-toggle" type="button" aria-haspopup="true" aria-expanded="false">Реж 1 ▾</button><div id="modeOptions" class="mode-options hidden"><button type="button" data-mode="1">Режим 1</button><button type="button" data-mode="2">Режим 2</button></div></div>
  </header>
  <section class="game-shell" aria-label="Игра">
    <div class="hud">
      <div><span>СЧЁТ</span><strong id="volkScore">0</strong></div>
      <div><span>РЕКОРД</span><strong id="volkBest">0</strong></div>
      <div><span>ЖИЗНИ</span><strong id="volkLives">♥ ♥ ♥ ♥</strong></div>
      <button id="soundToggle" class="sound-toggle" type="button" aria-label="Звук включён">♫ ЗВУК</button>
    </div>
    <div class="stage-wrap">
      <canvas id="volkCanvas" width="640" height="520" aria-label="Волк ловит падающие яйца"></canvas>
      <div id="volkOverlay" class="overlay hidden">
        <div class="overlay-card">
          <div class="wolf-mark">🐺</div>
          <h2 id="overlayTitle">Ну, погоди!</h2>
          <p id="overlayText">Лови яйца в четырёх лотках. Переключайся между дорожками и не дай яйцам разбиться!</p>
        </div>
      </div>
    </div>
    <div class="lane-controls" aria-label="Управление лотками">
      <button type="button" data-lane="0" aria-label="Передняя левая лапа">
        <svg class="paw paw-front-left" viewBox="0 0 40 40" aria-hidden="true"><g fill="currentColor" stroke="#553820" stroke-width="1.1" stroke-linejoin="round">
          <ellipse cx="9.2" cy="10.2" rx="4.1" ry="5.5" transform="rotate(-24 9.2 10.2)"/><ellipse cx="18.3" cy="6.9" rx="4.1" ry="5.6" transform="rotate(-7 18.3 6.9)"/><ellipse cx="27.1" cy="9.1" rx="4" ry="5.4" transform="rotate(17 27.1 9.1)"/><ellipse cx="33.2" cy="16.1" rx="3.5" ry="4.8" transform="rotate(31 33.2 16.1)"/>
          <path d="M8 24.2Q8.2 19.5 13.3 18.4Q17.1 17.5 20.3 19.4Q23.2 16.9 27.2 19.1Q32.4 21.8 30.5 28.1Q29.1 34.4 20.3 35.1Q10.2 35.7 8 29.5Q6.8 26.6 8 24.2Z"/>
        </g><path d="M7.1 5.7l-1.8-3.4 4.2 1.1M16.1 1.9l.2-1.8 3.1 1.6M29.7 4.6l2.8-2.3-.2 4.2" fill="#f5dfb6" stroke="#553820" stroke-width=".8" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-lane="1" aria-label="Задняя левая лапа">
        <svg class="paw paw-hind-left" viewBox="0 0 40 40" aria-hidden="true"><g fill="currentColor" stroke="#553820" stroke-width="1.1" stroke-linejoin="round">
          <ellipse cx="8.8" cy="11.8" rx="3.5" ry="5.1" transform="rotate(-30 8.8 11.8)"/><ellipse cx="17.2" cy="7.7" rx="3.8" ry="5.7" transform="rotate(-10 17.2 7.7)"/><ellipse cx="26.1" cy="8.6" rx="3.7" ry="5.5" transform="rotate(13 26.1 8.6)"/><ellipse cx="33" cy="15.2" rx="3.2" ry="4.5" transform="rotate(29 33 15.2)"/>
          <path d="M10.4 21.8Q13.2 17.2 18.4 19.4Q22.1 16.8 26.1 20.3Q30.3 24.2 28.7 29.8Q27.3 35.5 20.3 36.1Q12.4 36.4 9.6 31.8Q6.7 27.2 10.4 21.8Z"/>
        </g><path d="M6.7 7.1L5.1 3.8l3.8 1.2M15.2 2.3l.1-1.9 2.8 1.7M28.3 4.1l2.5-2.2.1 4" fill="#f5dfb6" stroke="#553820" stroke-width=".8" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-lane="2" aria-label="Задняя правая лапа">
        <svg class="paw paw-hind-right" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(9 20 20)" fill="currentColor" stroke="#553820" stroke-width="1.1" stroke-linejoin="round">
          <ellipse cx="7.5" cy="15.2" rx="3.2" ry="4.7" transform="rotate(-28 7.5 15.2)"/><ellipse cx="14.8" cy="8.2" rx="3.7" ry="5.5" transform="rotate(-12 14.8 8.2)"/><ellipse cx="24" cy="6.9" rx="3.8" ry="5.5" transform="rotate(8 24 6.9)"/><ellipse cx="32.2" cy="11.4" rx="3.3" ry="4.8" transform="rotate(26 32.2 11.4)"/>
          <path d="M9.8 23.2Q12.5 18.1 17.3 19.6Q21.5 17.6 25.5 20.8Q31.2 25 28.2 31.3Q25.7 36.1 19.3 35.2Q11.8 34.7 9.2 30.1Q7.5 26.8 9.8 23.2Z"/>
        </g><path d="M5.7 11.2l-1-3.7 3.4 1.9M13 3l-.2-2 3 1.8M27.7 2.8l2.8-1.5-.6 4" fill="#f5dfb6" stroke="#553820" stroke-width=".8" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-lane="3" aria-label="Передняя правая лапа">
        <svg class="paw paw-front-right" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(17 20 20)" fill="currentColor" stroke="#553820" stroke-width="1.1" stroke-linejoin="round">
          <ellipse cx="7.5" cy="16.2" rx="3.8" ry="5.2" transform="rotate(-31 7.5 16.2)"/><ellipse cx="15.8" cy="8.1" rx="4.1" ry="5.7" transform="rotate(-12 15.8 8.1)"/><ellipse cx="25.2" cy="7.3" rx="4" ry="5.6" transform="rotate(9 25.2 7.3)"/><ellipse cx="33" cy="12.7" rx="3.6" ry="5" transform="rotate(28 33 12.7)"/>
          <path d="M8.2 24.4Q10.1 19.3 15.1 19.3Q19.1 16.9 23.1 19.2Q29.1 20.8 30.5 26.2Q32 32.7 24.6 35.1Q16.3 38 10.4 32.7Q6.5 29.3 8.2 24.4Z"/>
        </g><path d="M4.8 12.1l-.7-3.8 3.3 2M13.8 3l-.1-2 3.1 1.8M29 3.1l2.7-1.8-.4 4.1" fill="#f5dfb6" stroke="#553820" stroke-width=".8" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="game-actions">
      <button id="startVolk" class="start-btn" type="button">▶ ПУСК</button>
      <button id="exitVolk" class="start-btn" type="button" hidden>ВЫЙТИ ИЗ ИГРЫ</button>
      <p>На телефоне нажимай нужный лоток. На компьютере — клавиши 1–4 или стрелки.</p>
    </div>
  </section>
</main>
<script src="game-volk.js"></script>
<script src="game-navigation.js"></script>
</body>
</html>
