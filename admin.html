<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Панель администратора</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex,nofollow,noarchive">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth-check.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;min-height:100%;margin:0;overflow-x:hidden}
body{font-family:Arial,sans-serif;background:#e9e0d5;padding:20px;color:#3d332b;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
.container{position:relative;width:100%;max-width:1000px;margin:0 auto;background:rgba(255,255,255,.96);padding:30px;border-radius:20px;box-shadow:0 8px 28px rgba(55,38,25,.12)}
.admin-topbar{width:100%;min-height:44px;display:flex;align-items:center;justify-content:flex-start;margin-bottom:8px}
h1{text-align:center;color:#800020;margin:8px 0 25px;line-height:1.2}
h2{color:#800020;margin-top:35px;line-height:1.25}
table{width:100%;border-collapse:collapse;margin-top:15px}
th{background:#800020;color:white;padding:12px;text-align:left}
td{padding:12px;border-bottom:1px solid #ddd;overflow-wrap:anywhere;vertical-align:middle}
button{min-height:40px;padding:8px 15px;border:none;border-radius:12px;cursor:pointer;background:#800020;color:white;font-weight:bold;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{opacity:.85}
button:disabled{opacity:.55;cursor:wait}
.home-button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 15px;text-decoration:none;text-align:center;background:linear-gradient(135deg,#171412 0%,#3e3027 50%,#735039 100%);background-size:180% 180%;color:#fffaf5;font-size:14px;font-weight:bold;border:1px solid rgba(255,255,255,.2);border-radius:11px;box-shadow:0 5px 14px rgba(55,38,25,.18);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;animation:homeGradient 5s ease infinite}
.home-button:hover{opacity:1;transform:translateY(-1px) scale(1.02);box-shadow:0 7px 18px rgba(55,38,25,.28);filter:brightness(1.08)}
@keyframes homeGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.pending-info{margin-top:20px;font-size:24px;font-weight:bold;color:#800020}
.badge{display:inline-flex;align-items:center;justify-content:center;background:#f39c12;color:white;border-radius:50%;min-width:34px;height:34px;line-height:34px;text-align:center;font-size:20px;margin-left:8px;vertical-align:middle}
.action-buttons{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:nowrap;width:100%}
.action-button{min-width:42px;height:42px;padding:7px 9px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-size:13px}
.approve-button{background:#2e7d32}
.reject-button{background:#b23a32}
.exclude-button{background:#800020}
.user-name{font-weight:700;color:#4d4035}
.user-email{font-size:13px;color:#66584d}

@media (max-width:700px){
body{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.container{width:100%;max-width:100%;padding:12px;border-radius:15px}
.admin-topbar{min-height:42px;margin-bottom:4px}
.home-button{width:100%;min-height:44px;padding:10px 12px;font-size:14px;border-radius:11px}
h1{font-size:22px;margin:14px 0 18px}
h2{font-size:18px;margin-top:22px}
.badge{min-width:30px;height:30px;line-height:30px;font-size:17px}
table,thead,tbody,tr,td{display:block;width:100%}
table{margin-top:10px;overflow:visible}
thead{display:none}
tbody{display:grid;gap:8px}
tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"email actions" "name actions" "status actions" "role actions";column-gap:8px;background:#fff;border:1px solid #eadfd5;border-radius:12px;box-shadow:0 3px 10px rgba(55,38,25,.07);overflow:hidden;padding:8px 9px}
td{min-height:0;padding:3px 0;border:0;font-size:12px;white-space:normal}
td::before{display:inline;margin-right:5px;color:#806f62;font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.03em}
td[data-label="Email"]{grid-area:email}
td[data-label="Имя"]{grid-area:name}
td[data-label="Статус"]{grid-area:status}
td[data-label="Роль"]{grid-area:role}
td[data-label="Действие"]{grid-area:actions;align-self:center;padding:0;min-width:104px}
td[data-label="Действие"]::before{display:none}
.action-buttons{width:104px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:5px}
.action-button{width:104px;height:38px;min-height:38px;padding:5px 6px;border-radius:8px;font-size:12px}
.user-email{font-size:12px}
}

@media (max-width:380px){
.container{padding:10px}
h1{font-size:20px}
h2{font-size:17px}
tr{grid-template-columns:minmax(0,1fr) 94px;column-gap:6px;padding:7px}
td[data-label="Действие"],.action-buttons{min-width:94px;width:94px}
.action-button{width:94px;height:36px;min-height:36px;font-size:11px;padding:4px}
}
</style>
</head>
<body>
<div class="container">
<div class="admin-topbar"><a href="index.html" class="home-button">🏠 На главную</a></div>
<h1>⚙ Панель администратора</h1>
<h2>⏳ Ожидают одобрения <span id="pendingBadge" class="badge"></span></h2>
<table id="pendingTable" style="display:none"><thead><tr><th>Email</th><th>Имя</th><th>Статус</th><th>Роль</th><th>Действие</th></tr></thead><tbody id="pendingList"></tbody></table>
<h2>✅ Одобренные пользователи</h2>
<table id="approvedTable" style="display:none"><thead><tr><th>Email</th><th>Имя</th><th>Статус</th><th>Роль</th><th>Действие</th></tr></thead><tbody id="approvedList"></tbody></table>
</div>
<script>
let currentAdminUserId=null;

async function checkAdmin(){
    const {data:{user}}=await supabaseClient.auth.getUser();
    if(!user){window.location.href="login.html";return}
    currentAdminUserId=user.id;
    const {data:profile,error}=await supabaseClient.from("profiles").select("*").eq("id",user.id).single();
    if(error||!profile){window.location.href="index.html";return}
    if(profile.role!=="admin"||profile.approved!==true){window.location.href="index.html";return}
    document.getElementById("pendingTable").style.display="table";
    document.getElementById("approvedTable").style.display="table";
    loadUsers();
}

function makeCell(label,value,extraClass=""){
    const td=document.createElement("td");
    td.dataset.label=label;
    if(extraClass)td.className=extraClass;
    td.textContent=value;
    return td;
}

function makeActionCell(buttons){
    const td=document.createElement("td");
    td.dataset.label="Действие";
    const wrap=document.createElement("div");
    wrap.className="action-buttons";
    buttons.forEach(button=>wrap.appendChild(button));
    td.appendChild(wrap);
    return td;
}

function makeActionButton(text,className,handler,title){
    const button=document.createElement("button");
    button.type="button";
    button.className=`action-button ${className}`;
    button.textContent=text;
    if(title)button.title=title;
    button.addEventListener("click",handler);
    return button;
}

function renderUserRow(profile,isPending){
    const row=document.createElement("tr");
    const emailCell=makeCell("Email",profile.email??"");
    emailCell.classList.add("user-email");
    const nameCell=makeCell("Имя",profile.username??"");
    nameCell.classList.add("user-name");
    row.appendChild(emailCell);
    row.appendChild(nameCell);
    row.appendChild(makeCell("Статус",isPending?"⏳ Ожидает":"✅ Одобрен"));
    row.appendChild(makeCell("Роль",profile.role??"user"));

    if(isPending){
        const approve=makeActionButton("✓ Одобрить","approve-button",()=>approveUser(profile.id),"Одобрить пользователя");
        const reject=makeActionButton("✕ Отклонить","reject-button",()=>rejectUser(profile.id),"Отклонить заявку");
        row.appendChild(makeActionCell([approve,reject]));
    }else{
        const exclude=makeActionButton("Исключить","exclude-button",()=>excludeUser(profile.id),"Исключить пользователя");
        row.appendChild(makeActionCell([exclude]));
    }
    return row;
}

async function loadUsers(){
    const {count}=await supabaseClient.from("profiles").select("*",{count:"exact",head:true}).eq("approved",false);
    const badge=document.getElementById("pendingBadge");
    if((count??0)>0){badge.textContent=count;badge.style.display="inline-flex"}else{badge.style.display="none"}

    const {data,error}=await supabaseClient.from("profiles").select("*").order("username");
    if(error){console.log(error);return}
    const pendingList=document.getElementById("pendingList");
    const approvedList=document.getElementById("approvedList");
    pendingList.innerHTML="";
    approvedList.innerHTML="";
    (data??[]).forEach(profile=>{
        if(profile.approved===false)pendingList.appendChild(renderUserRow(profile,true));
        if(profile.approved===true)approvedList.appendChild(renderUserRow(profile,false));
    });
}

async function setApproved(id,value,successText){
    if(id===currentAdminUserId&&value===false){alert("Нельзя исключить текущего администратора.");return}
    const {data,error}=await supabaseClient.from("profiles").update({approved:value}).eq("id",id).select();
    if(error){alert(error.message);console.log(error);return}
    if(!data||!data.length){alert("Операция не выполнена. Проверьте RLS-политику profiles.");return}
    alert(successText);
    loadUsers();
}

async function approveUser(id){await setApproved(id,true,"Пользователь одобрен.")}

async function excludeUser(id){
    if(!confirm("Исключить пользователя из одобренных? Он потеряет доступ к чату."))return;
    await setApproved(id,false,"Пользователь исключён.");
}

async function rejectUser(id){
    alert("Отклонение заявки пока не выполняется удалением аккаунта: в текущей схеме profiles нет отдельного статуса rejected. Чтобы не оставлять Auth-аккаунт в неконсистентном состоянии, заявка остаётся в ожидании.");
}

checkAdmin();
</script>
</body>
</html>
