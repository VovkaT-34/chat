<style>
*{box-sizing:border-box}html,body{width:100%;max-width:100%;min-height:100%;margin:0;overflow-x:hidden}body{font-family:Arial,sans-serif;background:#e9e0d5;padding:20px;color:#3d332b;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}.container{position:relative;width:100%;max-width:1000px;margin:0 auto;background:rgba(255,255,255,.96);padding:30px;border-radius:20px;box-shadow:0 8px 28px rgba(55,38,25,.12)}.admin-topbar{width:100%;min-height:44px;display:flex;align-items:center;justify-content:flex-start;margin-bottom:8px}h1{text-align:center;color:#800020;margin:8px 0 25px;line-height:1.2}h2{color:#800020;margin-top:35px;line-height:1.25}table{width:100%;border-collapse:collapse;margin-top:15px}th{background:#800020;color:white;padding:12px;text-align:left}td{padding:12px;border-bottom:1px solid #ddd;overflow-wrap:anywhere;vertical-align:middle}button{min-height:40px;padding:8px 15px;border:none;border-radius:12px;cursor:pointer;background:#800020;color:white;font-weight:bold;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:hover{opacity:.85}button:disabled{opacity:.55;cursor:wait}.home-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 15px;text-decoration:none;text-align:center;background:linear-gradient(135deg,#171412 0%,#3e3027 50%,#735039 100%);background-size:180% 180%;color:#fffaf5;font-size:14px;font-weight:bold;border:1px solid rgba(255,255,255,.2);border-radius:11px;box-shadow:0 5px 14px rgba(55,38,25,.18);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;animation:homeGradient 5s ease infinite}.home-button:hover{opacity:1;transform:translateY(-1px) scale(1.02);box-shadow:0 7px 18px rgba(55,38,25,.28);filter:brightness(1.08)}@keyframes homeGradient{0%,100%{background-position:0% 50%}}.badge{display:inline-flex;align-items:center;justify-content:center;background:#f39c12;color:white;border-radius:50%;min-width:34px;height:34px;line-height:34px;text-align:center;font-size:20px;margin-left:8px;vertical-align:middle}.action-buttons{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:nowrap;width:100%}.action-button{min-width:42px;height:42px;padding:7px 9px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-size:13px}.approve-button{background:#2e7d32}.reject-button{background:#b23a32}.exclude-button{background:#800020}.admin-button{background:#5b3a8e}.user-name{font-weight:700;color:#4d4035}.user-email{font-size:13px;color:#66584d}.icon-svg{display:inline-block;vertical-align:middle;flex:none}@media (max-width:700px){body{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.container{width:100%;max-width:100%;padding:12px;border-radius:15px}.admin-topbar{min-height:42px;margin-bottom:4px}.home-button{width:100%;min-height:44px;padding:10px 12px;font-size:14px;border-radius:11px}h1{font-size:22px;margin:14px 0 18px}h2{font-size:18px;margin-top:22px}.badge{min-width:30px;height:30px;line-height:30px;font-size:17px}table,thead,tbody,tr,td{display:block;width:100%}table{margin-top:10px;overflow:visible}thead{display:none}tbody{display:grid;gap:8px}tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"email actions" "name actions" "status actions" "role actions";column-gap:8px;background:#fff;border:1px solid #eadfd5;border-radius:12px;box-shadow:0 3px 10px rgba(55,38,25,.07);overflow:hidden;padding:8px 9px}td{min-height:0;padding:3px 0;border:0;font-size:12px;white-space:normal}td::before{display:inline;margin-right:5px;color:#806f62;font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.03em}td[data-label="Email"]{grid-area:email}td[data-label="Имя"]{grid-area:name}td[data-label="Статус"]{grid-area:status}td[data-label="Роль"]{grid-area:role}td[data-label="Действие"]{grid-area:actions;align-self:center;padding:0;min-width:104px}td[data-label="Действие"]::before{display:none}.action-buttons{width:104px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:5px}.action-button{width:104px;height:38px;min-height:38px;padding:5px 6px;border-radius:8px;font-size:12px}.user-email{font-size:12px}}@media (max-width:380px){.container{padding:10px}h1{font-size:20px}h2{font-size:17px}tr{grid-template-columns:minmax(0,1fr) 94px;column-gap:6px;padding:7px}td[data-label="Действие"],.action-buttons{min-width:94px;width:94px}.action-button{width:94px;height:36px;min-height:36px;font-size:11px;padding:4px}}
.app-permissions{display:none;margin-top:30px}.app-permissions-list{display:grid;gap:8px;margin-top:12px}.app-permission-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid #eadfd5;border-radius:12px;background:#fff}.app-permission-user{min-width:0;display:grid;gap:3px}.app-permission-user strong{overflow-wrap:anywhere}.app-permission-user span{font-size:12px;color:#66584d;overflow-wrap:anywhere}.app-permission-control{display:flex;align-items:center;gap:6px;white-space:nowrap}.app-permission-control span{font-size:12px;color:#66584d}.permission-toggle{width:42px;min-width:42px;height:40px;padding:0;font-size:22px;line-height:1;background:#777}.permission-toggle.allowed{background:#2e7d32}.permission-toggle:disabled{opacity:.55;cursor:wait}.app-permissions-error{color:#b23a32;font-size:13px}@media(max-width:700px){.app-permission-row{grid-template-columns:minmax(0,1fr) auto;gap:7px}.app-permission-control{grid-column:2}.app-permission-control span{display:none}}
/* Внешний вид карточек и элементов в единой теме со списком чатов */
.container{background:transparent!important;color:#fff!important}
.container h1,.container h2,.container p,.container td,.container .user-name,.container .user-email,.container .app-permission-user strong,.container .app-permission-user span,.container .app-permission-control span{color:#fff!important}
.container th{background:#6b310f!important;color:#fff!important;border-bottom:1px solid rgba(255,255,255,.3)}
.container td{border-bottom-color:rgba(255,255,255,.25)!important}
.container .home-button,.container button{background:#000!important;color:#fff!important;border:1px solid rgba(255,255,255,.28)!important}
.container .home-button:hover,.container button:hover{background:#222!important;color:#fff!important}
.container .approve-button,.container .reject-button,.container .exclude-button,.container .admin-button,.container .permission-toggle{background:#000!important;color:#fff!important}
.container .permission-toggle.allowed{background:#000!important;color:#fff!important}
.container .app-permission-row{background:#6b310f!important;border-color:rgba(255,255,255,.28)!important}
.container .app-permissions-error{color:#fff!important}
@media(max-width:700px){.container tr{background:#6b310f!important;border-color:rgba(255,255,255,.28)!important}}

</style>
<script>
(function(){
    "use strict";
    var KEY="chatExternalTheme";
    var themes={
        "metal-classic":{
            color:"#92999d",
            image:"linear-gradient(145deg,#aeb5b9 0%,#929a9f 48%,#a3aaae 100%)",
            size:"100% 100%",
            animation:"none"
        },
        "metal-grid":{
            color:"#92999d",
            image:"linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(0deg,rgba(35,42,46,.10) 1px,transparent 1px),linear-gradient(145deg,#aeb5b9 0%,#929a9f 48%,#a3aaae 100%)",
            size:"64px 48px,64px 48px,100% 100%",
            animation:"externalMetalGrid 28s ease-in-out infinite"
        },
        "metal-large":{
            color:"#92999d",
            image:"linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(0deg,rgba(35,42,46,.12) 1px,transparent 1px),linear-gradient(145deg,#aeb5b9 0%,#929a9f 48%,#a3aaae 100%)",
            size:"128px 96px,128px 96px,100% 100%",
            animation:"externalMetalLarge 36s ease-in-out infinite"
        },
        "gold-shine":{
            color:"#b58a35",
            image:"linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.38) 25%,rgba(255,255,255,.08) 48%,rgba(112,70,0,.10) 75%,rgba(255,255,255,.12) 100%),radial-gradient(circle at 20% 30%,rgba(255,255,255,.34) 0 2px,transparent 3px),linear-gradient(135deg,#8a641e 0%,#d9bd70 25%,#f7d774 50%,#fff3bd 70%,#b17a1f 100%)",
            size:"260% 260%,120px 120px,100% 100%",
            animation:"externalGoldShine 30s ease-in-out infinite"
        },
        "gold-large":{
            color:"#b58a35",
            image:"linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.38) 25%,rgba(255,255,255,.08) 48%,rgba(112,70,0,.10) 75%,rgba(255,255,255,.12) 100%),repeating-conic-gradient(rgba(255,247,205,.25) 0% 25%,transparent 0% 50%),repeating-conic-gradient(rgba(92,55,0,.20) 0% 25%,transparent 0% 50%),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(0deg,rgba(92,55,0,.16) 1px,transparent 1px),linear-gradient(135deg,#8a641e 0%,#d9bd70 25%,#f7d774 50%,#fff3bd 70%,#b17a1f 100%)",
            size:"260% 260%,256px 192px,256px 192px,128px 96px,128px 96px,100% 100%",
            animation:"externalGoldCells 20s ease-in-out infinite"
        }
    };
    var style=document.createElement("style");
    style.id="chatExternalThemeMotion";
    style.textContent="@keyframes externalMetalGrid{0%,100%{background-position:0 0,0 0,0 0}50%{background-position:32px 24px,-32px -24px,0 0}}"+
        "@keyframes externalMetalLarge{0%,100%{background-position:0 0,0 0,0 0}50%{background-position:64px 48px,-64px -48px,0 0}}"+
        "@keyframes externalGoldShine{0%,100%{background-position:0% 50%,0 0,0 0}50%{background-position:100% 50%,40px 30px,0 0}}"+"@keyframes externalGoldCells{0%,100%{background-position:0% 50%,0 0,128px 96px,0 0,0 0,0 0;background-size:260% 260%,256px 192px,256px 192px,128px 96px,128px 96px,100% 100%}50%{background-position:100% 50%,128px 96px,0 0,0 0,0 0,0 0;background-size:260% 260%,288px 216px,224px 168px,128px 96px,128px 96px,100% 100%}}";
    document.head.appendChild(style);
    function apply(){
        var id=localStorage.getItem(KEY)||"metal-grid";
        var theme=themes[id]||themes["metal-grid"];
        var body=document.body;
        body.style.setProperty("background-color",theme.color,"important");
        body.style.setProperty("background-image",theme.image,"important");
        var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if(id==="gold-large"&&!reduced)body.style.removeProperty("background-size");
        else body.style.setProperty("background-size",theme.size,"important");
        body.style.setProperty("animation",reduced?"none":theme.animation,"important");
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",apply,{once:true});
    else apply();
})();
</script>
</head>
<body>
<div class="container"><div class="admin-topbar"><a href="index.html" class="home-button"><svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>На главную</a></div><h1><svg class="icon-svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Панель администратора</h1><h2 id="adminsHeading" style="display:none"><svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Администраторы</h2><table id="adminsTable" style="display:none"><thead><tr><th>Email</th><th>Имя</th><th>Статус</th><th>Роль</th><th>Действие</th></tr></thead><tbody id="adminsList"></tbody></table><h2><svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> Ожидают одобрения <span id="pendingBadge" class="badge"></span></h2><table id="pendingTable" style="display:none"><thead><tr><th>Email</th><th>Имя</th><th>Статус</th><th>Роль</th><th>Действие</th></tr></thead><tbody id="pendingList"></tbody></table><h2><svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg> Одобренные пользователи</h2><table id="approvedTable" style="display:none"><thead><tr><th>Email</th><th>Имя</th><th>Статус</th><th>Роль</th><th>Действие</th></tr></thead><tbody id="approvedList"></tbody></table><section id="appPermissionsSection" class="app-permissions"><h2>Доступ к приложениям</h2><p style="font-size:13px;color:#66584d;margin:0">Только супер-администратор может менять разрешения. По умолчанию доступ закрыт.</p><div id="appPermissionsList" class="app-permissions-list"></div><div id="appPermissionsError" class="app-permissions-error" role="status"></div></section></div>
<script>
let currentAdminUserId=null;let currentAdminRole=null;
async function checkAdmin(){const {data:{user},error:userError}=await supabaseClient.auth.getUser();if(userError||!user){window.location.href="login.html";return}currentAdminUserId=user.id;const {data:profiles,error}=await supabaseClient.rpc("check_my_profile");const profile=profiles&&profiles[0]?profiles[0]:null;if(error||!profile){window.location.href="index.html";return}if(!["admin","superadmin"].includes(profile.role)||profile.approved!==true){window.location.href="index.html";return}currentAdminRole=profile.role;document.getElementById("pendingTable").style.display="table";document.getElementById("approvedTable").style.display="table";if(currentAdminRole==="superadmin"){document.getElementById("adminsHeading").style.display="block";document.getElementById("adminsTable").style.display="table";document.getElementById("appPermissionsSection").style.display="block"}await loadUsers()}
function makeCell(label,value,extraClass=""){const td=document.createElement("td");td.dataset.label=label;if(extraClass)td.className=extraClass;td.textContent=value;return td}
function makeActionCell(buttons){const td=document.createElement("td");td.dataset.label="Действие";const wrap=document.createElement("div");wrap.className="action-buttons";buttons.forEach(button=>wrap.appendChild(button));td.appendChild(wrap);return td}
function makeActionButton(text,className,handler,title){const button=document.createElement("button");button.type="button";button.className=`action-button ${className}`;button.textContent=text;if(title)button.title=title;button.addEventListener("click",handler);return button}
function renderUserRow(profile,isPending,isAdminList=false){const row=document.createElement("tr");const emailCell=makeCell("Email",profile.email??"");emailCell.classList.add("user-email");const nameCell=makeCell("Имя",profile.username??"");nameCell.classList.add("user-name");row.appendChild(emailCell);row.appendChild(nameCell);row.appendChild(makeCell("Статус",isPending?"Ожидает":"Одобрен"));row.appendChild(makeCell("Роль",profile.role??"user"));const buttons=[];if(isPending){buttons.push(makeActionButton("Одобрить","approve-button",()=>adminAction("approve",profile.id,"Пользователь одобрен."),"Одобрить пользователя"));buttons.push(makeActionButton("Отклонить","reject-button",()=>adminAction("delete",profile.id,"Заявка отклонена, аккаунт удалён."),"Отклонить заявку и удалить аккаунт"))}else if(isAdminList){buttons.push(makeActionButton("Снять админа","admin-button",()=>adminAction("set_role",profile.id,"Права администратора сняты.","user"),"Снять права администратора"))}else if(profile.id===currentAdminUserId){}else if(['admin','superadmin'].includes(profile.role||'')){if(currentAdminRole==="superadmin"&&profile.role==="admin")buttons.push(makeActionButton("Снять админа","admin-button",()=>adminAction("set_role",profile.id,"Права администратора сняты.","user"),"Снять права администратора"))}else{buttons.push(makeActionButton("Исключить","exclude-button",()=>adminAction("delete",profile.id,"Пользователь удалён."),"Удалить пользователя"));if(currentAdminRole==="superadmin")buttons.push(makeActionButton("Назначить админом","admin-button",()=>adminAction("set_role",profile.id,"Пользователь назначен администратором.","admin"),"Назначить администратора"))}row.appendChild(makeActionCell(buttons));return row}
async function loadUsers(){const {data,error}=await supabaseClient.rpc("admin_list_profiles");if(error){console.log(error);return}const count=(data??[]).filter(profile=>profile.approved===false).length;const badge=document.getElementById("pendingBadge");if(count>0){badge.textContent=count;badge.style.display="inline-flex"}else{badge.style.display="none"}const adminsList=document.getElementById("adminsList");const pendingList=document.getElementById("pendingList");const approvedList=document.getElementById("approvedList");adminsList.innerHTML="";pendingList.innerHTML="";approvedList.innerHTML="";(data??[]).forEach(profile=>{if(currentAdminRole==="superadmin"&&profile.approved===true&&profile.role==="admin")adminsList.appendChild(renderUserRow(profile,false,true));if(profile.approved===false)pendingList.appendChild(renderUserRow(profile,true));if(profile.approved===true&&profile.role==="user")approvedList.appendChild(renderUserRow(profile,false))});if(currentAdminRole==="superadmin")await loadAppPermissions()}
async function loadAppPermissions(){const list=document.getElementById("appPermissionsList");const status=document.getElementById("appPermissionsError");list.innerHTML="";status.textContent="";const {data,error}=await supabaseClient.rpc("get_app_permissions_for_admin");if(error||!Array.isArray(data)){status.textContent=error?.message||"Не удалось загрузить разрешения.";return}const users=new Map();for(const item of data){if(!users.has(item.user_id))users.set(item.user_id,{email:item.email||"",username:item.username||"",role:item.role||"user",permissions:[]});users.get(item.user_id).permissions.push(item)}for(const [userId,user] of users){const row=document.createElement("div");row.className="app-permission-row";const identity=document.createElement("div");identity.className="app-permission-user";const name=document.createElement("strong");name.textContent=user.username||user.email||userId;const email=document.createElement("span");email.textContent=(user.email||"")+" · "+user.role;identity.append(name,email);row.appendChild(identity);for(const permission of user.permissions){const control=document.createElement("div");control.className="app-permission-control";const label=document.createElement("span");label.textContent=permission.app_name;const button=document.createElement("button");button.type="button";button.className="permission-toggle"+(permission.allowed?" allowed":"");button.textContent=permission.allowed?"+":"−";button.title=permission.app_name+": "+(permission.allowed?"доступ открыт":"доступ закрыт")+" — нажмите, чтобы изменить";button.setAttribute("aria-label",button.title);button.addEventListener("click",()=>setAppPermission(userId,permission.app_id,!permission.allowed,button,permission.app_name));control.append(label,button);row.appendChild(control)}list.appendChild(row)}}
async function setAppPermission(userId,appId,allowed,button,appName){button.disabled=true;const {data,error}=await supabaseClient.rpc("set_app_permission",{p_user_id:userId,p_app_id:appId,p_allowed:allowed});if(error||!data?.ok){button.disabled=false;document.getElementById("appPermissionsError").textContent=error?.message||"Не удалось изменить разрешение.";return}button.textContent=allowed?"+":"−";button.classList.toggle("allowed",allowed);button.title=appName+": "+(allowed?"доступ открыт":"доступ закрыт")+" — нажмите, чтобы изменить";button.setAttribute("aria-label",button.title);button.disabled=false;document.getElementById("appPermissionsError").textContent=""}
async function adminAction(action,id,successText,role=null){if(!confirm(action==="approve"?"Одобрить пользователя?":action==="reject"?"Отклонить заявку? Аккаунт будет полностью удалён из системы.":action==="delete"?"Полностью удалить пользователя? Его сообщения сохранятся без привязки к аккаунту.":role==="admin"?"Назначить пользователя администратором?":"Снять права администратора?"))return;const body={action,userId:id};if(role)body.role=role;try{const {data,error}=await supabaseClient.functions.invoke("admin-user-action",{body});if(error){console.error(error);let detail="";try{if(error.context instanceof Response)detail=await error.context.text();}catch{}alert(detail?`${error.message}\n\nОтвет функции: ${detail}`:(error.message||"Операция не выполнена."));return}if(!data?.ok){alert(data?.error||"Операция не выполнена.");return}alert(successText);await loadUsers()}catch(error){console.error(error);alert(error?.message||"Операция не выполнена.")}}
checkAdmin();
</script>
</body>
</html>
