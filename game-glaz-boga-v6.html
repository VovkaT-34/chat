<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>👁️ Глаз Бога — глобальный поиск</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(145deg,#171318,#35242f 55%,#171318);color:#fff;margin:0;padding:16px}.page{max-width:1000px;margin:auto}.top{display:flex;gap:10px;align-items:center}.back{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.title{margin:0}.search{display:flex;gap:8px;margin:18px 0 10px}.search input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:rgba(0,0,0,.25);color:#fff;padding:14px;font-size:16px}.go{border:0;border-radius:13px;background:#8b3657;color:#fff;padding:14px 18px;font-weight:800;cursor:pointer}.status{display:none;padding:11px 12px;margin:12px 0 14px;border-radius:12px;background:rgba(255,255,255,.06);color:#d8cfd4;font-size:13px}.results{display:none}.box{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;background:rgba(255,255,255,.055)}.row{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;line-height:1.45}.row:last-child{border:0}.row a{color:#f0a5bd;text-decoration:none}.muted{color:#aaa0a6;font-size:12px}.special{margin-top:12px}.special a{display:inline-block;margin:5px 6px 0 0;text-decoration:none;color:#fff;background:rgba(180,75,112,.72);border-radius:9px;padding:8px 10px;font-size:13px}.note{margin-top:16px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);color:#bfb5bb;font-size:12px;line-height:1.45}@media(max-width:650px){.search{flex-direction:column}.go{width:100%}.title{font-size:23px}}
</style>
</head>
<body>
<main class="page"><div class="top"><button class="back" onclick="location.href='games.html'">← Игры</button><h1 class="title">👁️ Глаз Бога</h1></div><p>Один запрос — поиск сразу по Google, Bing, Яндексу, DuckDuckGo, Mojeek и другим открытым источникам. Результаты появляются прямо здесь.</p><div class="search"><input id="q" autocomplete="off" placeholder="ФИО, username, телефон, VIN, госномер, email, домен, IP"><button class="go" onclick="runSearch()">🔎 Найти</button></div><div class="status" id="status"></div><section class="results" id="results"><h2>Результаты поиска</h2><div class="box" id="box"></div><div class="special" id="special"></div></section><div class="note">Только открытые источники. Закрытые аккаунты, украденные базы, пароли и обход ограничений не используются.</div></main>
<script>
const SEARCH='https://sxkukrqjtgkxmzuzondm.supabase.co/functions/v1/osint-public';const q=document.getElementById('q'),statusBox=document.getElementById('status'),results=document.getElementById('results'),box=document.getElementById('box'),special=document.getElementById('special');const enc=v=>encodeURIComponent(v.trim());const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(msg){statusBox.style.display='block';statusBox.textContent=msg}function add(title,url,source){const e=document.createElement('div');e.className='row';e.innerHTML='🔎 '+esc(source||'Источник')+' · <a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(title||url)+'</a><div class="muted">'+esc(url)+'</div>';box.appendChild(e)}function addSpecial(title,url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=title;special.appendChild(a)}
function setupUniversalSources(v){special.innerHTML='';const x=enc(v);addSpecial('Google','https://www.google.com/search?hl=ru&q='+x);addSpecial('Bing','https://www.bing.com/search?cc=ru&setlang=ru&q='+x);addSpecial('Яндекс','https://yandex.ru/search/?lr=213&text='+x);addSpecial('DuckDuckGo','https://html.duckduckgo.com/html/?kl=ru-ru&q='+x);addSpecial('Mojeek','https://www.mojeek.com/search?q='+x);addSpecial('VK','https://www.google.com/search?hl=ru&q='+encodeURIComponent('"'+v+'" site:vk.com'));addSpecial('OK','https://www.google.com/search?hl=ru&q='+encodeURIComponent('"'+v+'" site:ok.ru'));addSpecial('Telegram','https://www.google.com/search?hl=ru&q='+encodeURIComponent('"'+v+'" site:t.me'));if(/^[A-HJ-NPR-Z0-9]{17}$/i.test(v)){addSpecial('NHTSA VIN','https://vpic.nhtsa.dot.gov/decoder/');addSpecial('NICB VINCheck','https://www.nicb.org/vincheck');addSpecial('Drom VIN','https://vin.drom.ru/proverka/gos-nomer/')}if(/^[A-ZА-ЯЁ0-9 -]{5,12}$/i.test(v)&&/[0-9]/.test(v)){addSpecial('Drom: госномер/VIN','https://vin.drom.ru/proverka/gos-nomer/');addSpecial('Госномер.ру','https://statenumber.ru/');addSpecial('AVCHECK','https://avcheck.ru/proverit-po-gosnomeru')}if(/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(v)){addSpecial('crt.sh','https://crt.sh/?q='+x);addSpecial('Wayback','https://web.archive.org/web/*/'+x);addSpecial('urlscan.io','https://urlscan.io/search/#'+x)}if(/^(?:\d{1,3}\.){3}\d{1,3}$/.test(v)){addSpecial('IPinfo','https://ipinfo.io/'+x);addSpecial('BGP HE','https://bgp.he.net/ip/'+x);addSpecial('RIPEstat','https://stat.ripe.net/app/launchpad/');addSpecial('urlscan.io','https://urlscan.io/search/#'+x)}}
async function runSearch(){const v=q.value.trim();if(!v){q.focus();return}results.style.display='block';box.innerHTML='';special.innerHTML='';show('🔎 Ищем один и тот же запрос сразу по всем доступным источникам…');setupUniversalSources(v);try{const variants=[v,'"'+v+'"'];if(/\s/.test(v))variants.push('"'+v+'"');const ds=await Promise.all(variants.map(x=>fetch(SEARCH+'?type=search&q='+enc(x),{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})));const seen=new Set();let n=0;const engines={};ds.forEach(d=>{(d.engines||[]).forEach(x=>{engines[x.engine]=(engines[x.engine]||0)+Number(x.count||0)});(d.results||[]).forEach(x=>{const u=String(x.url||'');if(!/^https?:\/\//i.test(u)||seen.has(u))return;seen.add(u);n++;add(x.title,u,x.source)})});const es=Object.entries(engines).map(([k,c])=>k+': '+c).join(' · ');show('Готово: '+n+' уникальных результатов. '+(es||'Источники не вернули результаты.'))}catch(e){show('Ошибка поиска: '+e.message)}}q.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
</script></body></html>
