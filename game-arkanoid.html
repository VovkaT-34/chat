<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>🧱 Арканоид</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="game-arkanoid.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="auth-check.js"></script>
</head>
<body>
  <div class="page">
    <div class="top">
      <button class="back" onclick="location.href='games.html'">← Игры</button>
      <h1 class="title">🧱 Арканоид</h1>
      <span id="arkanoidScore" class="score">0</span>
    </div>
    <canvas id="arkanoidCanvas" class="racing-canvas" width="600" height="600"></canvas>
    <div class="game-controls-wide">
      <div class="wide-grid">
        <button class="mobile-pause pause-btn" onclick="toggleArkanoidPause()">Пауза</button>
        <button class="game-btn" data-ark="left">◀</button>
        <button class="game-btn" data-ark="right">▶</button>
      </div>
    </div>
    <p class="hint desktop-hint">Компьютер: ← → платформа · Пробел — пауза</p>
  </div>
  <script>var activeGame='arkanoid';</script>
  <script src="game-arkanoid.js"></script>
  <script>startArkanoid();document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();toggleArkanoidPause();return}if(e.code==='ArrowLeft'){e.preventDefault();moveArk(-1)}if(e.code==='ArrowRight'){e.preventDefault();moveArk(1)}});</script>
</body>
</html>
