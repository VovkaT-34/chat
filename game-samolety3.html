<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Самолётики 3</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="game-samolety3.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="auth-check.js"></script>
  <script>
    document.addEventListener('copy',e=>e.preventDefault());
    document.addEventListener('cut',e=>e.preventDefault());
    document.addEventListener('selectstart',e=>e.preventDefault());
    document.addEventListener('contextmenu',e=>e.preventDefault());
    document.addEventListener('dragstart',e=>e.preventDefault());
  </script>
</head>
<body>
  <main>
    <div class="top">
      <button onclick="location.href='games.html'">← Игры</button>
      <h1>✈️ Самолётики 3</h1>
    </div>
    <div class="game-wrap">
      <canvas id="game"></canvas>
      <div class="controls">
        <button class="pause" onclick="togglePause()">Пауза</button>
        <button data-d="up">▲</button>
        <button data-d="left">◀</button>
        <button data-d="down">▼</button>
        <button data-d="right">▶</button>
      </div>
    </div>
  </main>
  <script src="game-samolety3.js"></script>
</body>
</html>
