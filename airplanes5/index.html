<script>
if(!WebAssembly.instantiateStreaming){WebAssembly.instantiateStreaming=async(resp,importObject)=>{const source=await(await resp).arrayBuffer();return WebAssembly.instantiate(source,importObject);};}
let audioCtx=null,musicTimer=null,musicStep=0,gameplayActive=false,paused=false;
let mpChannel=null;
let mpSocket=null;
let mpSocketConnected=false;
let mpWelcomeReceived=false;
let mpInputSeq=0;
let mpLastDX=0;
let mpLastDY=0;
let mpKey=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
let mpRoom='';
let mpLocalPlayer=1;
let mpPeerCount=1;
let mpLocalSelection=-1;
let mpLocalReady=false;
let mpRemotePlayers={};
let mpRemoteControls={};
let mpRemoteShots={};
let mpEnemyHits=[];
let mpShotSequence=0;
let mpPanelNotice='';
let mpPresenceTimer=0;
let mpLastControl=0;
let mpStarted=false;
let mpRoomPaused=false;
let mpSelectionScreenVisible=false;
let mpLocalServerState=null;
let mpReconnectTimer=null;
let mpReconnectDelay=1000;
let mpReconnectSelection=-1;
let mpReconnectReady=false;
let mpPendingSelection=false;
let mpJoinSequence=0;

function mpRoomCode(){
  const raw=new URLSearchParams(location.search).get('room');
  if(raw&&/^[A-Za-z0-9]{4,8}$/.test(raw)) return raw.toUpperCase();
  return Math.random().toString(36).slice(2,6).toUpperCase();
}
function mpHideLobbyUI(){
  const launch=document.getElementById('mpLaunch');
  const panel=document.getElementById('mpPanel');
  const notice=document.getElementById('mpNotice');
  if(launch)launch.style.display='none';
  if(panel)panel.classList.add('hidden');
  if(notice)notice.classList.remove('show');
}
function mpUpdateUI(){
  if(mpStarted)mpHideLobbyUI();
  const s=document.getElementById('mpStatus'), inp=document.getElementById('mpRoomInput');
  if(!s)return;
  s.textContent='Игрок '+mpLocalPlayer+' · '+mpPeerCount+'/4'+(mpPanelNotice?' · '+mpPanelNotice:'');
  const launch=document.getElementById('mpLaunch'), checks=document.getElementById('mpChecks');
  if(launch&&!mpStarted){launch.disabled=mpLocalSelection<0; launch.innerHTML='ПУСК<div id="mpChecks" class="mp-checks">'+Array.from({length:4},(_,i)=>'<span class="mp-check '+((i+1===mpLocalPlayer?mpLocalSelection>=0:(mpRemotePlayers[i+1]?.selection>=0))?'ok':'')+'">✓ '+(i+1)+'</span>').join('')+'</div>';}
  if(inp && document.activeElement!==inp) inp.value=mpRoom;
}
function mpRebuildState(){
  if(!mpChannel)return;
  const state=mpChannel.presenceState();
  const peers=[];
  for(const [key, metas] of Object.entries(state)){
    const m=Array.isArray(metas)?metas[0]:metas;
    peers.push({key, ...(m||{})});
  }
  peers.sort((a,b)=>(Number(a.joinedAt)||0)-(Number(b.joinedAt)||0)||a.key.localeCompare(b.key));
  const mine=peers.findIndex(p=>p.key===mpKey);
  mpLocalPlayer=mine<0?1:mine+1;
  if(mpLocalPlayer>2)mpLocalPlayer=4;
  mpPeerCount=Math.min(peers.length,4);
  mpRemotePlayers={};
  for(let i=0;i<peers.length&&i<4;i++){
    const p=peers[i];
    const player=i+1;
    if(p.key!==mpKey){
      mpRemotePlayers[player]={selection:Number.isInteger(p.selection)?p.selection:-1,ready:!!p.ready};
    }
  }
  mpUpdateUI();
}
async function mpTrack(){
  if(!mpChannel)return;
  await mpChannel.track({joinedAt:Number(mpKey.split('-')[0],36)||Date.now(),selection:mpLocalSelection,ready:mpLocalReady});
  mpRebuildState();
}
async function mpJoin(room,isReconnect=false){
  const joinSequence=++mpJoinSequence;
  room=String(room||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  if(mpReconnectTimer){clearTimeout(mpReconnectTimer);mpReconnectTimer=null;}
  if(!isReconnect){mpReconnectDelay=1000;mpReconnectSelection=-1;mpReconnectReady=false;}
  if(room.length<4){if(!isReconnect){mpPanelNotice='Код комнаты: минимум 4 символа';mpUpdateUI();}return;}
  if(mpSocket){const oldSocket=mpSocket;mpSocket=null;try{oldSocket.close();}catch(e){}}
  mpRoom=room;
  mpPanelNotice='';
  mpUpdateUI();
  const url=new URL(location.href);url.searchParams.set('room',room);history.replaceState(null,'',url.toString());
  mpSocketConnected=false;
  mpWelcomeReceived=false;
  if(!isReconnect){
    mpRemotePlayers={};
    mpPeerCount=1;
    mpLocalReady=false;
    mpLocalSelection=-1;
    mpPendingSelection=false;
    mpStarted=false;
  }
  const scheme=location.protocol==='https:'?'wss:':'ws:';
  try{
    if (!window.supabaseClient) throw new Error('Supabase авторизация не загружена');
    const sessionResult = await window.supabaseClient.auth.getSession();
    const accessToken = sessionResult && sessionResult.data && sessionResult.data.session
      ? sessionResult.data.session.access_token : '';
    if (!accessToken) throw new Error('Нет действующей сессии');
    const ticketResponse = await fetch('https://airplanes5-multiplayer.onrender.com/auth-ticket', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken }
    });
    if(joinSequence!==mpJoinSequence)return;
    if (!ticketResponse.ok) {
      const status=ticketResponse.status;
      if(status===403)throw new Error('Доступ к игре закрыт (403)');
      if(status===401)throw new Error('Нужен вход в аккаунт (401)');
      if(status===429)throw new Error('Слишком много попыток (429)');
      throw new Error('Сервер: HTTP '+status);
    }
    const ticketData = await ticketResponse.json();
    if(joinSequence!==mpJoinSequence)return;
    if (!ticketData.ticket) throw new Error('Сервер не выдал пропуск');
    const wsUrl=scheme+'//airplanes5-multiplayer.onrender.com/ws?room='+encodeURIComponent(room)+'&session='+encodeURIComponent(mpKey)+'&ticket='+encodeURIComponent(ticketData.ticket);
    const socket=new WebSocket(wsUrl);
    mpSocket=socket;
    socket.onopen=()=>{
      if(joinSequence!==mpJoinSequence||mpSocket!==socket)return;
      mpSocketConnected=true;
      mpReconnectDelay=1000;
      mpPanelNotice='';
      mpUpdateUI();
      if(mpPendingSelection){
        const sel=mpReconnectSelection, ready=mpReconnectReady;
        mpPendingSelection=false;mpReconnectSelection=-1;mpReconnectReady=false;
        mpSendSelection(sel,ready);
      }
    };
    socket.onclose=(event)=>{
      if(joinSequence!==mpJoinSequence||mpSocket!==socket)return;
      mpSocketConnected=false;
      if(mpLocalSelection>=0){mpReconnectSelection=mpLocalSelection;mpReconnectReady=mpLocalReady;mpPendingSelection=true;}
      mpPanelNotice='Соединение закрыто ('+(event&&event.code?event.code:'без кода')+'), повтор…';
      mpUpdateUI();
      if(!mpReconnectTimer){
        const delay=mpReconnectDelay;
        mpReconnectDelay=Math.min(mpReconnectDelay*2,15000);
        mpReconnectTimer=setTimeout(()=>{mpReconnectTimer=null;mpJoin(mpRoom,true);},delay);
      }
    };
    socket.onerror=()=>{if(joinSequence!==mpJoinSequence||mpSocket!==socket)return;mpSocketConnected=false;mpPanelNotice='Ошибка связи';mpUpdateUI();};
    socket.onmessage=(event)=>{
      if(joinSequence!==mpJoinSequence||mpSocket!==socket)return;
      let m;try{m=JSON.parse(event.data);}catch(e){return;}
      if(m.type==='welcome'){
        mpWelcomeReceived=true;
        mpLocalPlayer=Math.max(1,Math.min(4,Number(m.player)||1));
        mpUpdateUI();
        return;
      }
      if(m.type==='pause'){
        mpRoomPaused=!!m.paused;
        window.__airplanes5SetPaused(mpRoomPaused);
        return;
      }
      if(m.type!=='snapshot'||!Array.isArray(m.players)||!mpWelcomeReceived)return;
      mpPeerCount=Math.min(m.players.length,4);
      const next={};
      for(const p of m.players){
        const player=Number(p.id);
        if(player===mpLocalPlayer){
          mpLocalServerState=p;
          mpLocalSelection=Number(p.selection);
          mpLocalReady=!!p.ready;
        }else if(player>=1&&player<=4){
          next[player]={selection:Number(p.selection),ready:!!p.ready,x:Number(p.x)||0,y:Number(p.y)||0,dx:Number(p.dx)||0,dy:Number(p.dy)||0,fireSeq:Number(p.fireSeq)||0};
        }
      }
      mpRemotePlayers=next;
      mpLastSnapshotAt=performance.now();
      if(m.phase==='game') mpStarted=true;
      mpRoomPaused=!!m.paused;
      window.__airplanes5SetPaused(mpRoomPaused);
      if(mpStarted)mpHideLobbyUI();
      mpUpdateUI();
    };
  }catch(e){
    if(joinSequence!==mpJoinSequence)return;
    mpPanelNotice=(e&&e.message)?String(e.message):'Ошибка подключения';
    mpUpdateUI();
  }
}
function mpSendControl(dx,dy){
  if(!mpSocket||mpSocket.readyState!==WebSocket.OPEN)return;
  const now=performance.now();
  if(now-mpLastControl<45)return;
  mpLastControl=now;
  mpLastDX=Number(dx)||0; mpLastDY=Number(dy)||0;
  mpInputSeq++;
  mpSocket.send(JSON.stringify({type:'input',input:{seq:mpInputSeq,dx:mpLastDX,dy:mpLastDY,shoot:false}}));
}
function mpSendEnemyHit(enemyId){
  return;
}
function mpPressLaunch(){
  if(mpLocalSelection<0){mpPanelNotice='Сначала выберите самолёт';mpUpdateUI();return;}
  if(!mpLocalReady){mpLocalReady=true;mpPanelNotice='';mpSendSelection(mpLocalSelection,true);mpUpdateUI();}
  if(!mpCanStart()){mpPanelNotice='Не все игроки нажали ПУСК';mpUpdateUI();}
}
function mpCanStart(){
  if(mpLocalSelection<0||!mpLocalReady)return false;
  if(mpPeerCount<2)return false;
  for(const [player,p] of Object.entries(mpRemotePlayers)){
    if(Number(player)===mpLocalPlayer)continue;
    if(!p||p.selection<0||!p.ready)return false;
  }
  return true;
}
function mpSendShot(){
  if(!mpSocket||mpSocket.readyState!==WebSocket.OPEN)return;
  mpInputSeq++;
  mpSocket.send(JSON.stringify({type:'input',input:{seq:mpInputSeq,dx:mpLastDX,dy:mpLastDY,shoot:true}}));
}
function mpSendSelection(index,ready){
  const nextIndex=Number(index);
  const nextReady=!!ready;
  mpLocalSelection=nextIndex;
  mpLocalReady=nextReady;
  mpUpdateUI();
  if(!mpSocket||mpSocket.readyState!==WebSocket.OPEN){
    mpReconnectSelection=nextIndex;mpReconnectReady=nextReady;mpPendingSelection=true;
    return;
  }
  mpSocket.send(JSON.stringify({type:'selection',selection:nextIndex}));
  mpSocket.send(JSON.stringify({type:'ready',ready:nextReady}));
}
window.__airplanes5LocalPlayer=()=>mpLocalPlayer;
window.__airplanes5RemoteSelection=(player)=>mpRemotePlayers[Number(player)]?.selection ?? -1;
window.__airplanes5RemoteReady=(player)=>!!mpRemotePlayers[Number(player)]?.ready;
window.__airplanes5RemoteDX=(player)=>{
  const r=mpRemotePlayers[Number(player)];
  return r?Number(r.dx)||0:0;
};
window.__airplanes5RemoteDY=(player)=>{
  const r=mpRemotePlayers[Number(player)];
  return r?Number(r.dy)||0:0;
};
window.__airplanes5RemoteX=(player)=>{
  const r=mpRemotePlayers[Number(player)];
  return r?Number(r.x)||0:0;
};
window.__airplanes5RemoteY=(player)=>{
  const r=mpRemotePlayers[Number(player)];
  return r?Number(r.y)||0:0;
};
window.__airplanes5LocalX=()=>Number(mpLocalServerState?.x)||0;
window.__airplanes5LocalY=()=>Number(mpLocalServerState?.y)||0;
window.__airplanes5RemoteShot=(player)=>Number(mpRemotePlayers[Number(player)]?.fireSeq)||0;
window.__airplanes5CanStart=mpCanStart;
window.__airplanes5IsAuthority=()=>mpLocalPlayer===1;
window.__airplanes5SendEnemyHit=mpSendEnemyHit;
window.__airplanes5PeekEnemyHit=()=>mpEnemyHits.length?mpEnemyHits[0]:-1;
window.__airplanes5AckEnemyHit=(id)=>{if(mpEnemyHits.length&&mpEnemyHits[0]===Number(id))mpEnemyHits.shift();};
window.__airplanes5PlayerCount=()=>mpPeerCount;
window.__airplanes5SendControl=mpSendControl;
window.__airplanes5SendShot=mpSendShot;
window.__airplanes5SendSelection=mpSendSelection;
window.__airplanes5LocalReady=()=>mpLocalReady;
window.__airplanes5Launch=mpPressLaunch;
window.__airplanes5SelectionScreen=function(show){mpSelectionScreenVisible=!!show&&!mpStarted;const b=document.getElementById("mpLaunch");if(b)b.style.display=mpSelectionScreenVisible?"block":"none";if(mpStarted)mpHideLobbyUI();};
window.__airplanes5IsMultiplayer=()=>mpSocketConnected && mpPeerCount>1;
window.__airplanes5GameStarted=()=>mpStarted;
const melody=[261.63,329.63,392,329.63,293.66,349.23,440,349.23],bass=[130.81,130.81,146.83,146.83,164.81,164.81,146.83,146.83];
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function startMusic(){ensureAudio();if(musicTimer||paused||!gameplayActive)return;musicTimer=setInterval(()=>{if(paused||!gameplayActive||!audioCtx||audioCtx.state!=='running')return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=melody[musicStep%melody.length];g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.035,n+.025);g.gain.exponentialRampToValueAtTime(.0001,n+.28);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.3);if(musicStep%2===0){const b=audioCtx.createOscillator(),bg=audioCtx.createGain();b.type='sine';b.frequency.value=bass[(musicStep/2)%bass.length|0];bg.gain.setValueAtTime(.0001,n);bg.gain.exponentialRampToValueAtTime(.018,n+.02);bg.gain.exponentialRampToValueAtTime(.0001,n+.42);b.connect(bg).connect(audioCtx.destination);b.start(n);b.stop(n+.45);}musicStep++;},360);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}if(audioCtx&&audioCtx.state==='running')audioCtx.suspend();}
window.__airplanes5SetGameplay=function(active){gameplayActive=!!active;if(gameplayActive&&!paused)startMusic();else stopMusic();};
window.__airplanes5SetGameStarted=function(){mpStarted=true;mpHideLobbyUI();mpUpdateUI();};
window.__airplanes5PlayShot=function(){if(!gameplayActive||paused)return;ensureAudio();const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(760,n);o.frequency.exponentialRampToValueAtTime(240,n+.075);g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+.085);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.09);};
window.__airplanes5PauseRequest=null;
window.__airplanes5Pause=function(e){
  if(e){e.preventDefault();e.stopPropagation();}
  if(mpSocketConnected){
    const next=!mpRoomPaused;
    mpRoomPaused=next;
    window.__airplanes5SetPaused(next);
    mpSocket.send(JSON.stringify({type:'pause',paused:next}));
    return;
  }
  const next=!paused;window.__airplanes5SetPaused(next);window.__airplanes5PauseRequest=next;
};
window.__airplanes5SetPaused=function(value){paused=!!value;const b=document.getElementById('pauseButton');if(b)b.textContent=paused?'▶':'Ⅱ';if(paused)stopMusic();else if(gameplayActive)startMusic();};
window.addEventListener('pointerdown',()=>ensureAudio(),{passive:true});window.addEventListener('touchstart',()=>ensureAudio(),{passive:true});window.addEventListener('keydown',()=>ensureAudio(),{passive:true});
const initialRoom=mpRoomCode();document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mpRoomInput').value=initialRoom;const b=document.getElementById("mpLaunch");if(b)b.style.display=mpSelectionScreenVisible?"block":"none";mpJoin(initialRoom);});
const go=new Go();WebAssembly.instantiateStreaming(fetch('game.wasm?v=mp4client-20261121-1'),go.importObject).then(result=>go.run(result.instance)).catch(error=>console.error('Airplanes 5 WASM error:',error));
</script>
<div id="mpPanel" class="mp-panel"><span id="mpStatus" class="mp-status">Подключение…</span><input id="mpRoomInput" maxlength="8" aria-label="Код комнаты" placeholder="Код комнаты"><button type="button" onclick="mpJoin(document.getElementById('mpRoomInput').value)">Войти</button><button type="button" onclick="navigator.clipboard?.writeText(mpRoom)">Код</button><button type="button" class="mp-copy" onclick="navigator.clipboard?.writeText(location.href)">Ссылка</button></div>
<button id="mpLaunch" class="mp-launch" type="button" onclick="__airplanes5Launch()">ПУСК<div id="mpChecks" class="mp-checks"></div></button><div id="mpNotice" class="mp-notice"></div><div class="mobile-controls"><button id="pauseButton" class="pause" type="button" aria-label="Пауза" onclick="__airplanes5Pause(event)">Ⅱ</button></div>
