<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Airplanes 2 — Самолётики 5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block!important;width:100vw!important;height:100vh!important;object-fit:contain!important;touch-action:none}
.mobile-controls{position:fixed;inset:0;z-index:9999;pointer-events:none}
.joystick{display:none}
.pause{position:absolute;left:0;right:0;bottom:max(4px,env(safe-area-inset-bottom));width:100%;height:clamp(38px,7vh,62px);border:1px solid #ffffff55;border-radius:11px;background:#77777766;color:#fff;font-size:clamp(18px,4vw,30px);font-weight:700;opacity:.9;backdrop-filter:blur(2px);pointer-events:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media(min-width:700px){.mobile-controls{display:none}}
</style>
</head>
<body>
<script src="wasm_exec.js"></script>
<script>
if(!WebAssembly.instantiateStreaming){
  WebAssembly.instantiateStreaming=async(resp,importObject)=>{
    const source=await (await resp).arrayBuffer();
    return WebAssembly.instantiate(source,importObject);
  };
}

/* Лёгкий процедурный звук — без внешних аудиофайлов. */
let audioCtx=null;
let musicTimer=null;
let shotTimer=null;
let musicStep=0;
let audioStarted=false;

const melody=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23];
const bass=[130.81,130.81,146.83,146.83,164.81,164.81,146.83,146.83];

function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(audioStarted) return;
  audioStarted=true;

  musicTimer=setInterval(()=>{
    if(window.__airplanes5PauseRequest) return;
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='triangle';
    osc.frequency.value=melody[musicStep%melody.length];
    gain.gain.setValueAtTime(0,now);
    gain.gain.linearRampToValueAtTime(0.035,now+0.025);
    gain.gain.exponentialRampToValueAtTime(0.001,now+0.28);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.3);

    if(musicStep%2===0){
      const b=audioCtx.createOscillator();
      const bg=audioCtx.createGain();
      b.type='sine';
      b.frequency.value=bass[(musicStep/2)%bass.length|0];
      bg.gain.setValueAtTime(0.018,now);
      bg.gain.exponentialRampToValueAtTime(0.001,now+0.42);
      b.connect(bg).connect(audioCtx.destination);
      b.start(now); b.stop(now+0.45);
    }
    musicStep++;
  },360);

  /* В игре непрерывная автоматическая стрельба; звук синхронизирован с её темпом. */
  shotTimer=setInterval(()=>{
    if(window.__airplanes5PauseRequest) return;
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='square';
    osc.frequency.setValueAtTime(760,now);
    osc.frequency.exponentialRampToValueAtTime(240,now+0.075);
    gain.gain.setValueAtTime(0.045,now);
    gain.gain.exponentialRampToValueAtTime(0.001,now+0.085);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.09);
  },520);
}

window.__airplanes5PauseRequest=false;
window.__airplanes5Pause=function(e){
  if(e){e.preventDefault();e.stopPropagation();}
  window.__airplanes5PauseRequest=true;
  ensureAudio();
};

['pointerdown','touchstart','keydown'].forEach(type=>{
  window.addEventListener(type,()=>{
    window.__airplanes5PauseRequest=false;
    ensureAudio();
  },{passive:true});
});

const go=new Go();
WebAssembly.instantiateStreaming(fetch('game.wasm'),go.importObject)
  .then(result=>go.run(result.instance))
  .catch(error=>console.error('Airplanes 5 WASM error:',error));
</script>
<div class="mobile-controls">
  <button class="pause" type="button" onclick="__airplanes5Pause(event)" onpointerdown="__airplanes5Pause(event)" ontouchstart="__airplanes5Pause(event)">Ⅱ Пауза</button>
</div>
</body>
</html>
