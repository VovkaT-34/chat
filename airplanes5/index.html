<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Airplanes 2 — Самолётики 5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block!important;width:100vw!important;height:100vh!important;object-fit:contain!important;touch-action:none}
.mobile-controls{position:fixed;inset:0;z-index:10;pointer-events:none}
.joystick{position:absolute;right:clamp(16px,5vw,42px);bottom:clamp(105px,15vh,150px);width:clamp(130px,25vw,180px);height:clamp(130px,25vw,180px);border:2px solid #ffffff55;border-radius:50%;background:#77777730;box-shadow:inset 0 0 0 12px #ffffff12,0 0 12px #0008;opacity:.9;backdrop-filter:blur(2px)}
.joystick::before{content:"";position:absolute;left:50%;top:50%;width:clamp(54px,10vw,72px);height:clamp(54px,10vw,72px);transform:translate(-50%,-50%);border:2px solid #ffffff66;border-radius:50%;background:#99999955;box-shadow:0 0 10px #0008}
.joystick::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-53%);color:#ffffff99;font-size:clamp(22px,5vw,32px)}
.pause{position:absolute;left:0;bottom:max(4px,env(safe-area-inset-bottom));width:100vw;height:clamp(38px,7vh,62px);border:1px solid #ffffff55;border-radius:11px;background:#77777766;color:#fff;font-size:clamp(18px,4vw,30px);font-weight:700;opacity:.9;backdrop-filter:blur(2px)}
@media(min-width:700px){.mobile-controls{display:none}}
</style>
</head>
<body>
<script src="wasm_exec.js"></script>
<script>
if(!WebAssembly.instantiateStreaming){
  WebAssembly.instantiateStreaming=async(resp,importObject)=>{
    const source=await (await resp).arrayBuffer();
    return WebAssembly.instantiate(source,importObject);
  };
}
const go=new Go();
WebAssembly.instantiateStreaming(fetch('game.wasm'),go.importObject)
  .then(result=>go.run(result.instance))
  .catch(error=>console.error('Airplanes 5 WASM error:',error));
</script>
<div class="mobile-controls" aria-hidden="true">
  <div class="joystick"></div>
  <button class="pause">Ⅱ Пауза</button>
</div>
</body>
</html>
