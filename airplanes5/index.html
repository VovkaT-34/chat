<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Airplanes 2 — Самолётики 5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block!important;width:100vw!important;height:100vh!important;object-fit:contain!important;touch-action:none}
.mobile-controls{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 max(18px,env(safe-area-inset-bottom))}
.mobile-controls .pause{width:100vw;height:clamp(38px,7vh,62px);margin-bottom:4px;border:1px solid #ffffff55;border-radius:11px;background:#77777766;color:#fff;font-size:clamp(18px,4vw,30px);font-weight:700;opacity:.9;backdrop-filter:blur(2px)}
.mobile-controls .dirs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:4px;width:min(100vw,480px);height:min(25vh,200px);padding:0 4px}
.mobile-controls button{border:1px solid #ffffff55;border-radius:11px;background:#77777766;color:#fff;font-size:clamp(34px,8vw,60px);font-weight:700;opacity:.9;backdrop-filter:blur(2px)}
.mobile-controls .up{grid-column:2;grid-row:1}.mobile-controls .left{grid-column:1;grid-row:2;margin-top:-50%}.mobile-controls .down{grid-column:2;grid-row:2}.mobile-controls .right{grid-column:3;grid-row:2;margin-top:-50%}
@media(min-width:700px){.mobile-controls{display:none}}
</style>
</head>
<body>
<script src="wasm_exec.js"></script>
<script>
if(!WebAssembly.instantiateStreaming){
  WebAssembly.instantiateStreaming=async(resp,importObject)=>{
    const source=await (await resp).arrayBuffer();
    return WebAssembly.instantiate(source,importObject);
  };
}
const go=new Go();
WebAssembly.instantiateStreaming(fetch('game.wasm'),go.importObject)
  .then(result=>go.run(result.instance))
  .catch(error=>console.error('Airplanes 5 WASM error:',error));
</script>
<div class="mobile-controls" aria-hidden="true">
  <button class="pause">Ⅱ Пауза</button>
  <div class="dirs">
    <button class="up">▲</button>
    <button class="left">◀</button>
    <button class="down">▼</button>
    <button class="right">▶</button>
  </div>
</div>
</body>
</html>
