<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Airplanes 2 — Самолётики 5</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="../auth-check.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block!important;width:100vw!important;height:100vh!important;object-fit:contain!important;touch-action:none}
.mobile-controls{position:fixed;inset:0;z-index:9999;pointer-events:none}
.joystick{display:none}
.pause{position:absolute;left:0;right:0;bottom:max(4px,env(safe-area-inset-bottom));margin:auto;width:clamp(58px,14vw,82px);height:clamp(44px,8vh,62px);border:1px solid #ffffff55;border-radius:12px;background:#77777766;color:#fff;font-size:clamp(22px,5vw,32px);font-weight:700;line-height:1;opacity:.9;backdrop-filter:blur(2px);pointer-events:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media(min-width:700px){.mobile-controls{display:none}}
</style>
</head>
<body>
<script src="wasm_exec.js"></script>
<script>
if(!WebAssembly.instantiateStreaming){WebAssembly.instantiateStreaming=async(resp,importObject)=>{const source=await(await resp).arrayBuffer();return WebAssembly.instantiate(source,importObject);};}
let audioCtx=null,musicTimer=null,musicStep=0,gameplayActive=false,paused=false;
const melody=[261.63,329.63,392,329.63,293.66,349.23,440,349.23],bass=[130.81,130.81,146.83,146.83,164.81,164.81,146.83,146.83];
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function startMusic(){ensureAudio();if(musicTimer||paused||!gameplayActive)return;musicTimer=setInterval(()=>{if(paused||!gameplayActive||!audioCtx||audioCtx.state!=='running')return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=melody[musicStep%melody.length];g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.035,n+.025);g.gain.exponentialRampToValueAtTime(.0001,n+.28);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.3);if(musicStep%2===0){const b=audioCtx.createOscillator(),bg=audioCtx.createGain();b.type='sine';b.frequency.value=bass[(musicStep/2)%bass.length|0];bg.gain.setValueAtTime(.0001,n);bg.gain.exponentialRampToValueAtTime(.018,n+.02);bg.gain.exponentialRampToValueAtTime(.0001,n+.42);b.connect(bg).connect(audioCtx.destination);b.start(n);b.stop(n+.45);}musicStep++;},360);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}if(audioCtx&&audioCtx.state==='running')audioCtx.suspend();}
window.__airplanes5SetGameplay=function(active){gameplayActive=!!active;if(gameplayActive&&!paused)startMusic();else stopMusic();};
window.__airplanes5PlayShot=function(){if(!gameplayActive||paused)return;ensureAudio();const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(760,n);o.frequency.exponentialRampToValueAtTime(240,n+.075);g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+.085);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.09);};
window.__airplanes5PauseRequest=null;
window.__airplanes5Pause=function(e){if(e){e.preventDefault();e.stopPropagation();}window.__airplanes5PauseRequest=!paused;};
window.__airplanes5SetPaused=function(value){paused=!!value;const b=document.getElementById('pauseButton');if(b)b.textContent=paused?'▶':'Ⅱ';if(paused)stopMusic();else if(gameplayActive)startMusic();};
window.addEventListener('pointerdown',()=>ensureAudio(),{passive:true});window.addEventListener('touchstart',()=>ensureAudio(),{passive:true});window.addEventListener('keydown',()=>ensureAudio(),{passive:true});
const go=new Go();WebAssembly.instantiateStreaming(fetch('game.wasm'),go.importObject).then(result=>go.run(result.instance)).catch(error=>console.error('Airplanes 5 WASM error:',error));
</script>
<div class="mobile-controls"><button id="pauseButton" class="pause" type="button" aria-label="Пауза" onclick="__airplanes5Pause(event)">Ⅱ</button></div>
</body>
</html>
