<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>🐍 Змейка</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="game-змейка.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="auth-check.js"></script>
</head>
<body>
  <div class="page">
    <div class="top">
      <button class="back" onclick="location.href='games.html'">← Игры</button>
      <h1 class="title">🐍 Змейка</h1>
      <button id="snakeSoundToggle" class="snake-sound-toggle" type="button" aria-label="Звук включён">♫ ЗВУК</button>
      <span id="snakeScore" class="score">0</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="snakeCanvas" class="game-canvas" width="360" height="360"></canvas>
    </div>
    <div class="controls">
      <button class="mobile-pause pause-btn" onclick="toggleSnakePause()">Пуск</button>
      <button class="game-btn up" data-dir="up" aria-label="Вверх">▲</button>
      <button class="game-btn left" data-dir="left" aria-label="Влево">◀</button>
      <button class="game-btn down" data-dir="down" aria-label="Вниз">▼</button>
      <button class="game-btn right" data-dir="right" aria-label="Вправо">▶</button>
    </div>
    <p class="hint desktop-hint">Компьютер: стрелки ↑ ↓ ← → · Пробел — пауза</p>
  </div>
  <script src="game-змейка.js"></script>
</body>
</html>
