<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>🧱 Тетрис</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="game-tetris.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="auth-check.js"></script>
</head>
<body>
<div class="page">
  <div class="top"><button class="back" onclick="location.href='games.html'">← Игры</button><h1 class="title">🧱</h1><button id="tetrisSoundToggle" class="sound-toggle" type="button" aria-label="Звук включён">♫ ЗВУК</button><span id="tetrisScore" class="score">0</span></div>
  <div class="tetris-wrap"><canvas id="tetrisCanvas" class="tetris-canvas" width="300" height="600"></canvas><div class="tetris-next"><canvas id="tetrisNextCanvas" width="64" height="64"></canvas></div></div>
  <div class="game-controls-wide"><div class="wide-grid"><button class="mobile-pause pause-btn" onclick="toggleTetrisPause()">Пауза</button><button class="game-btn" data-tetris="left" aria-label="Влево"><svg class="dragon-art" viewBox="0 0 220 150" role="img" aria-label="Огнедышащий крылатый дракон" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="dragonScale" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe98a"/><stop offset=".28" stop-color="#d58b25"/><stop offset=".62" stop-color="#963b17"/><stop offset="1" stop-color="#351a17"/></linearGradient>
  <linearGradient id="dragonWing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd65a"/><stop offset=".48" stop-color="#b94b1d"/><stop offset="1" stop-color="#512018"/></linearGradient>
  <linearGradient id="dragonFire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fffbd0"/><stop offset=".3" stop-color="#ffe53d"/><stop offset=".68" stop-color="#ff6a08"/><stop offset="1" stop-color="#c91b08"/></linearGradient>
  <filter id="dragonGlow" x="-50%" y="-60%" width="210%" height="220%"><feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Дальнее крыло: уходит за спину, перепонка натянута между длинными пальцами -->
<g class="dragon-wing-far">
 <path d="M105 91 Q83 83 65 64 Q47 42 48 8 Q68 19 82 40 Q76 15 91 2 Q111 25 117 53 Q130 29 151 20 Q151 55 135 77 Q124 88 105 91Z" fill="#71301b" stroke="#3d1a14" stroke-width="4" stroke-linejoin="round"/>

 <path d="M106 89 Q78 52 48 8 M106 89 91 2 M108 89 117 53 M110 89 151 20" fill="none" stroke="#e7ae59" stroke-width="3" stroke-linecap="round"/>
 <path d="M74 67 Q68 47 66 28 M91 78 Q91 53 82 40 M122 81 Q132 59 135 40" fill="none" stroke="#d98b43" stroke-width="2" stroke-linecap="round"/>
</g>
<!-- Длинный хвост -->
<path d="M83 99 Q55 119 32 108 Q16 100 10 83 Q29 94 43 88 Q58 81 67 91" fill="none" stroke="#512219" stroke-width="15" stroke-linecap="round"/>

<path d="M12 83 2 69 22 76Z" fill="#e8b64b" stroke="#512219" stroke-width="3" stroke-linejoin="round"/>

 <path d="M57 88 Q72 69 103 76 Q127 80 139 98 Q124 119 91 119 Q65 114 57 88Z" fill="url(#dragonScale)" stroke="#452019" stroke-width="4"/>

</g>
<!-- Ближнее крыло: крупное, поверх туловища, с выраженными пальцами и вогнутыми перепонками -->
<g class="dragon-wing-near">
 <!-- Корень крыла остаётся на плече; пальцы раскрываются влево-вверх, примерно к отметке 50–51 минуты -->
 <path d="M104 91 Q84 77 67 59 Q43 54 23 65 Q30 45 7 37 Q34 28 39 8 Q59 12 69 34 Q67 13 82 3 Q101 25 99 48 Q112 30 132 25 Q130 53 117 71 Q111 84 104 91Z" fill="#a94720" stroke="#3d1a14" stroke-width="4" stroke-linejoin="round"/>
 <path d="M104 91 Q84 77 67 59 Q43 54 23 65 Q30 45 7 37 Q34 28 39 8 Q59 12 69 34 Q67 13 82 3 Q101 25 99 48 Q112 30 132 25 Q130 53 117 71 Q111 84 104 91Z" fill="url(#dragonWing)" opacity=".72"/>
 <path d="M105 89 Q83 47 82 3 M103 88 Q69 48 39 8 M99 87 Q53 59 7 37 M96 86 Q56 76 23 65 M106 87 Q111 51 132 25" fill="none" stroke="#ffdc83" stroke-width="3.2" stroke-linecap="round"/>
 <path d="M77 53 Q62 46 51 31 M55 62 Q44 56 37 48 M94 66 Q87 51 69 34 M113 68 Q119 56 124 43" fill="none" stroke="#6c2818" stroke-width="2.2" stroke-linecap="round"/>

<path d="M129 77 Q139 83 151 76" fill="none" stroke="#ffe18a" stroke-width="3" stroke-linecap="round"/>

<path d="M119 79 108 65 125 70 128 55 139 65 147 51 151 67" fill="#e7ad3c" stroke="#512219" stroke-width="3" stroke-linejoin="round"/>

<path d="M139 43 Q145 25 166 25 Q181 25 190 35 L211 42 Q218 46 215 54 L194 60 Q179 65 160 58 L145 57Z" fill="url(#dragonScale)" stroke="#452019" stroke-width="4" stroke-linejoin="round"/>
<!-- Два загнутых назад рога -->
<path d="M151 31 Q137 15 126 10 Q134 28 143 39Z M168 27 Q166 10 175 3 Q178 20 180 31Z" fill="#f1cf77" stroke="#512219" stroke-width="3" stroke-linejoin="round"/>
<!-- Глаз и ноздря -->
<path d="M165 34 Q174 29 181 35" fill="none" stroke="#351711" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="175" cy="35" rx="3.2" ry="2.6" fill="#fff4b2"/><circle cx="176" cy="35" r="1.8" fill="#17100d"/>
<path d="M204 45 209 47" stroke="#401a12" stroke-width="3" stroke-linecap="round"/>

<g class="dragon-jaw">
 <path d="M158 55 Q181 62 215 53 L207 68 Q180 77 157 61Z" fill="#a9431d" stroke="#452019" stroke-width="3.5" stroke-linejoin="round"/>
 <path d="M176 61 181 69 186 62 191 67 196 59" fill="#fff0c2" stroke="#fff0c2" stroke-width="1.5"/>
</g>
<!-- Пламя направлено прямо из пасти -->
<g class="dragon-fire-burst"><g class="dragon-fire" filter="url(#dragonGlow)">
 <path d="M211 43 Q225 27 239 33 Q231 44 244 48 Q230 55 242 67 Q222 66 209 57 Q218 50 211 43Z" fill="url(#dragonFire)"/>
 <path d="M211 47 Q226 42 236 48 Q225 53 237 59 Q220 58 210 54Z" fill="#fffbd0"/>
 <path d="M220 39 Q226 27 235 24 Q232 36 239 40" fill="#ff9a0b"/>
</g></g>
<g class="dragon-sparks" fill="#ffe56a"><path d="M224 19 228 9 232 19 241 23 232 27 228 37 224 27 215 23Z"/><circle cx="244" cy="76" r="3"/><circle cx="205" cy="20" r="2.5"/></g>
</svg><span class="dragon-control-arrow">◀</span></button><button class="game-btn" data-tetris="rotate">↻</button><button class="game-btn" data-tetris="right">▶</button><button class="game-btn" data-tetris="down">▼</button></div></div>
  <p class="hint desktop-hint">Компьютер: ← → движение · ↑ поворот · ↓ вниз · Пробел — пауза</p>
</div>
<script>var activeGame='tetris';</script><script src="game-tetris.js"></script><script>startTetris();document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();toggleTetrisPause();return}if(e.code==='ArrowLeft'){e.preventDefault();moveTetris(-1)}if(e.code==='ArrowRight'){e.preventDefault();moveTetris(1)}if(e.code==='ArrowDown'){e.preventDefault();tetrisStep()}if(e.code==='ArrowUp'){e.preventDefault();rotateTetris()}});</script>
</body></html>
