<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">

<title>Регистрация | Чат</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial,sans-serif;

    background:linear-gradient(
        135deg,
        #f3eadf,
        #eadcf0
    );

}

.register-box{

    width:400px;

    background:#ffffff;

    border-radius:20px;

    padding:35px;

    text-align:center;

    box-shadow:0 12px 35px rgba(0,0,0,.18);

}

.logo{

    font-size:44px;

}

h1{

    margin-top:10px;

    color:#6b3f6e;

}

.subtitle{

    color:#666;

    margin-bottom:25px;

}

input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border-radius:10px;

    border:1px solid #d7c7d7;

    font-size:16px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    font-size:17px;

    color:white;

    cursor:pointer;

    background:linear-gradient(
        135deg,
        #b38a59,
        #8b5f9d
    );

}

button:hover{

    opacity:.9;

}

#message{

    color:#b00020;

    margin-top:15px;

    min-height:22px;

}

.login-link{

    margin-top:20px;

}

.login-link a{

    color:#8b5f9d;

    text-decoration:none;

    font-weight:bold;

}

.footer{

    margin-top:25px;

    color:#888;

    font-size:13px;

}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">
👤
</div>

<h1>
Регистрация
</h1>

<div class="subtitle">
Создание нового аккаунта
</div>

<form id="registerForm">

<input
id="username"
type="text"
placeholder="Ваше имя"
required
>


<input
id="email"
type="email"
placeholder="E-mail"
required
>

<input
id="password"
type="password"
placeholder="Пароль"
required
>

<input
id="password2"
type="password"
placeholder="Повторите пароль"
required
>

<button type="submit">
Зарегистрироваться
</button>

</form>

<div id="message"></div>

<div class="login-link">

<a href="login.html">
Уже есть аккаунт? Войти
</a>

</div>

<div class="footer">
© Чат
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="register.js"></script>

</body>

</html>
