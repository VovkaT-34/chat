<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow,noarchive"><title>Регистрация | Чат</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f3eadf,#eadcf0)}.register-box{width:400px;max-width:calc(100% - 28px);background:#fff;border-radius:20px;padding:35px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.18)}.logo{display:flex;justify-content:center}.logo .icon-svg{width:48px;height:48px}.subtitle{color:#666;margin-bottom:25px}input{width:100%;padding:14px;margin-bottom:15px;border-radius:10px;border:1px solid #d7c7d7;font-size:16px}.password-wrap{position:relative}.password-wrap input{padding-right:48px}.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;border-radius:8px;background:transparent;color:#6b3f6e;cursor:pointer;display:flex;align-items:center;justify-content:center}.password-toggle:hover{background:#f2eaf4}.submit-button{width:100%;padding:15px;border:none;border-radius:10px;font-size:17px;color:white;cursor:pointer;background:linear-gradient(135deg,#b38a59,#8b5f9d)}.submit-button:hover{opacity:.9}#message{color:#b00020;margin-top:15px;min-height:22px}.login-link{margin-top:20px}.login-link a{color:#8b5f9d;text-decoration:none;font-weight:bold}.footer{margin-top:25px;color:#888;font-size:13px}.icon-svg{display:inline-block;vertical-align:middle;flex:none}
</style>
</head>
<body>
<div class="register-box"><div class="logo"><svg class="icon-svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></div><h1>Регистрация</h1><div class="subtitle">Создание нового аккаунта</div>
<form id="registerForm">
<input id="username" type="text" placeholder="Ваше имя" autocomplete="nickname" required>
<input id="email" type="email" placeholder="E-mail" autocomplete="email" required>
<div class="password-wrap"><input id="password" type="password" placeholder="Пароль" autocomplete="new-password" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Показать пароль" title="Показать пароль"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
<div class="password-wrap"><input id="password2" type="password" placeholder="Повторите пароль" autocomplete="new-password" required><button type="button" class="password-toggle" data-password-toggle="password2" aria-label="Показать пароль" title="Показать пароль"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
<button class="submit-button" type="submit">Зарегистрироваться</button>
</form>
<div id="message"></div><div class="login-link"><a href="login.html">Уже есть аккаунт? Войти</a></div><div class="footer">© Чат</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="register.js"></script>
<script>document.querySelectorAll('[data-password-toggle]').forEach(button=>{button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.passwordToggle);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';button.innerHTML=show?'<svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6 0 9.5 7 9.5 7a17.6 17.6 0 0 1-3.2 4.2"/><path d="M6.4 6.4C3.7 8.3 2.5 12 2.5 12S6 18 12 18c1.2 0 2.3-.2 3.3-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>':'<svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>';button.title=show?'Скрыть пароль':'Показать пароль';button.setAttribute('aria-label',button.title);input.focus()})});</script>
</body>
</html>
