<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Вход | Чат</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f3eadf,#eadcf0)}.login-box{width:400px;max-width:calc(100% - 28px);background:#fff;border-radius:20px;padding:35px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.18)}.logo{font-size:44px}h1{margin-top:10px;color:#6b3f6e}.subtitle{color:#666;margin-bottom:25px}input{width:100%;padding:14px;margin-bottom:15px;border-radius:10px;border:1px solid #d7c7d7;font-size:16px}.password-wrap{position:relative}.password-wrap input{padding-right:48px;margin-bottom:15px}.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;border-radius:8px;background:transparent;color:#6b3f6e;font-size:18px;cursor:pointer}.password-toggle:hover{background:#f2eaf4}.submit-button{width:100%;padding:15px;border:none;border-radius:10px;font-size:17px;color:white;cursor:pointer;background:linear-gradient(135deg,#b38a59,#8b5f9d)}.submit-button:hover{opacity:.9}#error{color:#b00020;margin-top:15px;min-height:22px}.register-link{margin-top:20px}.register-link a{color:#8b5f9d;text-decoration:none;font-weight:bold}.register-link a:hover{text-decoration:underline}.footer{margin-top:25px;color:#888;font-size:13px}
</style>
</head>
<body>
<div class="login-box"><div class="logo">💬</div><h1>Чат</h1><div class="subtitle">Войдите в свой аккаунт</div>
<form id="loginForm">
<input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
<div class="password-wrap"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Показать пароль" title="Показать пароль">👁</button></div>
<button class="submit-button" type="submit">Войти</button>
</form>
<div id="error"></div><div class="register-link"><a href="register.html">Нет аккаунта? Зарегистрироваться</a></div><div class="footer">© Чат</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js"></script>
<script>document.querySelectorAll('[data-password-toggle]').forEach(button=>{button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.passwordToggle);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'🙈':'👁';button.title=show?'Скрыть пароль':'Показать пароль';button.setAttribute('aria-label',button.title);input.focus()})});</script>
</body>
</html>
