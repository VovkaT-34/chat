<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Вход | Чат</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f3eadf,#eadcf0)}.login-box{width:400px;max-width:calc(100% - 28px);background:#fff;border-radius:20px;padding:35px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.18)}.logo{font-size:44px;display:flex;justify-content:center}.logo .icon-svg{width:48px;height:48px}.subtitle{color:#666;margin-bottom:25px}input{width:100%;padding:14px;margin-bottom:15px;border-radius:10px;border:1px solid #d7c7d7;font-size:16px}.password-wrap{position:relative}.password-wrap input{padding-right:48px;margin-bottom:15px}.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;border-radius:8px;background:transparent;color:#6b3f6e;cursor:pointer;display:flex;align-items:center;justify-content:center}.password-toggle:hover{background:#f2eaf4}.submit-button{width:100%;padding:15px;border:none;border-radius:10px;font-size:17px;color:white;cursor:pointer;background:linear-gradient(135deg,#b38a59,#8b5f9d)}.submit-button:hover{opacity:.9}#error{color:#b00020;margin-top:15px;min-height:22px}.register-link{margin-top:20px}.register-link a{color:#8b5f9d;text-decoration:none;font-weight:bold}.register-link a:hover{text-decoration:underline}.footer{margin-top:25px;color:#888;font-size:13px}.icon-svg{display:inline-block;vertical-align:middle;flex:none}
</style>
</head>
<body>
<div class="login-box"><div class="logo"><svg class="icon-svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v6A3.5 3.5 0 0 1 16.5 15H10l-5 4v-4.2a3.5 3.5 0 0 1-1-2.4v-6.9Z"/><path d="M8 8h8M8 11h5"/></svg></div><h1>Чат</h1><div class="subtitle">Войдите в свой аккаунт</div>
<form id="loginForm">
<input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
<div class="password-wrap"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Показать пароль" title="Показать пароль"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
<button class="submit-button" type="submit">Войти</button>
</form>
<div id="error"></div><div class="register-link"><a href="register.html">Нет аккаунта? Зарегистрироваться</a></div><div class="footer">© Чат</div>
</div>
<script src="auth.js"></script>
<script>document.querySelectorAll('[data-password-toggle]').forEach(function(button){button.addEventListener('click',function(){var input=document.getElementById(button.getAttribute('data-password-toggle'));if(!input)return;var show=input.type==='password';input.type=show?'text':'password';button.title=show?'Скрыть пароль':'Показать пароль';button.setAttribute('aria-label',button.title);input.focus();});});</script>
</body>
</html>
