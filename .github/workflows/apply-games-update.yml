name: apply games update
on:
  push:
    paths:
      - .github/workflows/apply-games-update.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch games.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('games.html')
          s=p.read_text(encoding='utf-8')
          old='''.tetris-wrap{width:600px;height:600px;margin:auto;display:flex;justify-content:center;align-items:center;background:#101315;border:2px solid rgba(255,255,255,.14);border-radius:16px}.tetris-canvas{width:300px;height:600px;background:#0a0c0d;touch-action:none}.racing-canvas,.shooter-canvas,.frogger-canvas{display:block;width:600px;height:600px;margin:auto;background:#101315;border:2px solid rgba(255,255,255,.14);border-radius:16px;touch-action:none}'''
          new='''.tetris-wrap{width:600px;height:600px;margin:auto;display:flex;justify-content:center;align-items:center;background:#2b2927;border:2px solid rgba(255,255,255,.28);border-radius:16px}.tetris-canvas{width:300px;height:600px;background:#0a0c0d;touch-action:none}.racing-canvas,.shooter-canvas,.frogger-canvas,#arkanoidCanvas,#pongCanvas{display:block;width:600px;height:600px;margin:auto;background:#101315;border:2px solid rgba(255,255,255,.18);border-radius:16px;touch-action:none}'''
          assert old in s
          s=s.replace(old,new,1)
          old='''.tetris-wrap{width:calc(100vw - 28px);height:calc(100vw - 28px);margin-left:50%;transform:translateX(-50%)}.tetris-canvas{width:calc((100vw - 28px)/2);height:calc(100vw - 28px)}.racing-canvas,.shooter-canvas,.frogger-canvas{width:calc(100vw - 28px);height:calc(100vw - 28px);margin-left:50%;transform:translateX(-50%);border-radius:12px}'''
          new='''.tetris-wrap{width:calc(100vw - 28px);height:calc(100vw - 28px);margin-left:50%;transform:translateX(-50%)}.tetris-canvas{width:calc((100vw - 28px)/2);height:calc(100vw - 28px)}.racing-canvas,.shooter-canvas,.frogger-canvas,#arkanoidCanvas,#pongCanvas{width:calc(100vw - 28px);height:calc(100vw - 28px);margin-left:50%;transform:translateX(-50%);border-radius:12px}'''
          assert old in s
          s=s.replace(old,new,1)
          marker='''<article class="game-card"><h2>🐸 Frogger</h2><p>Переведи персонажа через дорогу, не попав под машины.</p><button class="play" onclick="openGame('frogger')">Играть</button></article>'''
          add='''\n<article class="game-card"><h2>🧱 Арканоид</h2><p>Разбивай блоки мячом и не теряй платформу.</p><button class="play" onclick="openGame('arkanoid')">Играть</button></article>\n<article class="game-card"><h2>🏓 Понг</h2><p>Классическая игра на реакцию против компьютера.</p><button class="play" onclick="openGame('pong')">Играть</button></article>'''
          assert s.count(marker)==1
          s=s.replace(marker,marker+add,1)
          old="""function openGame(name){document.getElementById('menu').classList.add('hidden');document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active')});document.getElementById(name).classList.add('active');activeGame=name;if(name==='snake')startSnake();if(name==='tanks')startTanks();if(name==='2048')start2048();if(name==='tetris')startTetris();if(name==='racing')startRacing();if(name==='shooter')startShooter();if(name==='frogger')startFrogger()}"""
          new="""function openGame(name){document.getElementById('menu').classList.add('hidden');document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active')});document.getElementById(name).classList.add('active');activeGame=name;if(name==='snake')startSnake();if(name==='tanks')startTanks();if(name==='2048')start2048();if(name==='tetris')startTetris();if(name==='racing')startRacing();if(name==='shooter')startShooter();if(name==='frogger')startFrogger();if(name==='arkanoid')startArkanoid();if(name==='pong')startPong()}"""
          assert old in s
          s=s.replace(old,new,1)
          old='''<section id="frogger" class="screen"><div class="game-head"><button class="back game-back" onclick="backMenu()">← Игры</button><h2>🐸 Frogger</h2><span id="froggerScore" class="score">0</span></div><canvas id="froggerCanvas" class="frogger-canvas" width="600" height="600"></canvas><div class="game-controls-wide"><div class="wide-grid"><button class="mobile-pause pause-btn" onclick="toggleFroggerPause()">Пауза</button><button class="game-btn" data-frog="left">◀</button><button class="game-btn" data-frog="up">▲</button><button class="game-btn" data-frog="right">▶</button><button class="game-btn" data-frog="down">▼</button></div></div><p class="hint desktop-hint">Компьютер: стрелки — движение · Пробел — пауза</p></section>'''
          add='''\n<section id="arkanoid" class="screen"><div class="game-head"><button class="back game-back" onclick="backMenu()">← Игры</button><h2>🧱 Арканоид</h2><span id="arkanoidScore" class="score">0</span></div><canvas id="arkanoidCanvas" class="racing-canvas" width="600" height="600"></canvas><div class="game-controls-wide"><div class="wide-grid"><button class="mobile-pause pause-btn" onclick="toggleArkanoidPause()">Пауза</button><button class="game-btn" data-ark="left">◀</button><button class="game-btn" data-ark="right">▶</button></div></div><p class="hint desktop-hint">Компьютер: ← → платформа · Пробел — пауза</p></section>\n<section id="pong" class="screen"><div class="game-head"><button class="back game-back" onclick="backMenu()">← Игры</button><h2>🏓 Понг</h2><span id="pongScore" class="score">0 : 0</span></div><canvas id="pongCanvas" class="racing-canvas" width="600" height="600"></canvas><div class="game-controls-wide"><div class="wide-grid"><button class="mobile-pause pause-btn" onclick="togglePongPause()">Пауза</button><button class="game-btn" data-pong="up">▲</button><button class="game-btn" data-pong="down">▼</button></div></div><p class="hint desktop-hint">Компьютер: ↑ ↓ движение ракетки · Пробел — пауза</p></section>'''
          assert old in s
          s=s.replace(old,old+add,1)
          old='''var racingTimer,racingPaused=false,racingScore=0,racingCar={x:300,y:500},racingCars=[],racingSpeed=5;function startRacing(){clearInterval(racingTimer);racingPaused=false;racingScore=0;racingSpeed=5;racingCar={x:300,y:500};racingCars=[];document.getElementById('racingScore').textContent='0';for(var i=0;i<4;i++)racingCars.push({x:180+i%2*240,y:-i*180-120});drawRacing();racingTimer=setInterval(racingStep,35)}function toggleRacingPause(){if(activeGame!=='racing')return;racingPaused=!racingPaused}function moveRacing(d){if(racingPaused)return;racingCar.x=Math.max(155,Math.min(445,racingCar.x+d*22))}function racingStep(){if(racingPaused)return;racingCars.forEach(function(c){c.y+=racingSpeed});racingCars.forEach(function(c){if(c.y>650){c.y=-100-Math.random()*300;c.x=180+(Math.random()<.5?0:240);racingScore++;document.getElementById('racingScore').textContent=racingScore;racingSpeed=Math.min(11,5+racingScore*.12)}});for(var i=0;i<racingCars.length;i++)if(Math.abs(racingCars[i].x-racingCar.x)<55&&Math.abs(racingCars[i].y-racingCar.y)<85){startRacing();return}drawRacing()}function drawRacing(){var c=document.getElementById('racingCanvas'),x=c.getContext('2d');x.fillStyle='#1b1b1b';x.fillRect(0,0,600,600);x.fillStyle='#3d3d3d';x.fillRect(130,0,340,600);x.fillStyle='#d8c07a';x.fillRect(130,0,5,600);x.fillRect(465,0,5,600);x.fillStyle='#f5f5f5';for(var y=(Date.now()/4)%80-80;y<600;y+=80)x.fillRect(298,y,5,45);drawCar(x,racingCar.x,racingCar.y,'#63b878');racingCars.forEach(function(c){drawCar(x,c.x,c.y,'#d86c61')})}function drawCar(x,px,py,color){x.fillStyle=color;x.fillRect(px-22,py-38,44,76);x.fillStyle='#101315';x.fillRect(px-14,py-25,28,18);x.fillRect(px-14,py+12,28,16);x.fillStyle='#111';x.fillRect(px-27,py-28,7,18);x.fillRect(px+20,py-28,7,18);x.fillRect(px-27,py+10,7,18);x.fillRect(px+20,py+10,7,18)}document.querySelectorAll('[data-race]').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();if(b.dataset.race==='left')moveRacing(-1);if(b.dataset.race==='right')moveRacing(1)})});'''
          new='''var racingTimer,racingPaused=false,racingScore=0,racingCar={lane:1},racingCars=[],racingSpeed=4,racingLives=5,racingBrake=false;function startRacing(){clearInterval(racingTimer);racingPaused=false;racingScore=0;racingSpeed=4;racingLives=5;racingCar={lane:1};racingCars=[];document.getElementById('racingScore').textContent='0';for(var i=0;i<6;i++)racingCars.push({lane:Math.floor(Math.random()*4),y:-80-i*145,v:1+(i%3)*.15});drawRacing();racingTimer=setInterval(racingStep,35)}function toggleRacingPause(){if(activeGame!=='racing')return;racingPaused=!racingPaused}function moveRacing(d){if(racingPaused)return;racingCar.lane=Math.max(0,Math.min(3,racingCar.lane+d))}function racingStep(){if(racingPaused)return;racingCars.forEach(function(c){c.y+=racingSpeed*c.v*(racingBrake?.55:1)});racingCars.forEach(function(c){if(c.y>650){c.y=-90-Math.random()*220;c.lane=Math.floor(Math.random()*4);racingScore++;document.getElementById('racingScore').textContent=racingScore;racingSpeed=Math.min(9,4+racingScore*.08)}});for(var i=0;i<racingCars.length;i++){var c=racingCars[i];if(c.lane===racingCar.lane&&Math.abs(c.y-510)<72){racingLives--;if(racingLives<=0){startRacing();return}c.y=-150-Math.random()*250;c.lane=Math.floor(Math.random()*4)}}drawRacing()}function drawRacing(){var c=document.getElementById('racingCanvas'),x=c.getContext('2d');x.fillStyle='#151515';x.fillRect(0,0,600,600);x.fillStyle='#2e2e2e';x.fillRect(90,0,420,600);x.fillStyle='#d8c07a';x.fillRect(90,0,6,600);x.fillRect(504,0,6,600);x.strokeStyle='#9b9b9b';x.lineWidth=3;for(var i=1;i<4;i++){x.setLineDash([28,28]);x.lineDashOffset=-(Date.now()/4)%56;x.beginPath();x.moveTo(90+i*105,0);x.lineTo(90+i*105,600);x.stroke()}x.setLineDash([]);for(var i=0;i<racingCars.length;i++)drawCar(x,90+racingCars[i].lane*105+52,racingCars[i].y,'#d86c61');drawCar(x,90+racingCar.lane*105+52,510,'#63b878');x.fillStyle='#fff';x.font='18px Arial';x.fillText('Жизни: '+racingLives,18,28);x.fillText('Скорость: '+Math.round(racingSpeed),18,52)}function drawCar(x,px,py,color){x.fillStyle=color;x.fillRect(px-22,py-38,44,76);x.fillStyle='#101315';x.fillRect(px-14,py-25,28,18);x.fillRect(px-14,py+12,28,16);x.fillStyle='#111';x.fillRect(px-27,py-28,7,18);x.fillRect(px+20,py-28,7,18);x.fillRect(px-27,py+10,7,18);x.fillRect(px+20,py+10,7,18)}document.querySelectorAll('[data-race]').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();if(b.dataset.race==='left')moveRacing(-1);if(b.dataset.race==='right')moveRacing(1);if(b.dataset.race==='down')racingBrake=!racingBrake})});'''
          assert old in s
          s=s.replace(old,new,1)
          # Insert the two new game engines before keyboard handler.
          marker='''document.addEventListener('keydown',function(e){'''
          addjs='''var arkTimer,arkPaused=false,arkScore=0,arkP={x:270},arkBall={x:300,y:520,dx:4,dy:-4},arkBricks=[];function startArkanoid(){clearInterval(arkTimer);arkPaused=false;arkScore=0;arkP={x:270};arkBall={x:300,y:520,dx:4,dy:-4};arkBricks=[];document.getElementById('arkanoidScore').textContent='0';for(var r=0;r<5;r++)for(var c=0;c<8;c++)arkBricks.push({x:55+c*62,y:60+r*28,a:true});drawArkanoid();arkTimer=setInterval(arkanoidStep,25)}function toggleArkanoidPause(){if(activeGame!=='arkanoid')return;arkPaused=!arkPaused}function moveArk(d){if(!arkPaused)arkP.x=Math.max(35,Math.min(565,arkP.x+d*28))}function arkanoidStep(){if(arkPaused)return;var b=arkBall;b.x+=b.dx;b.y+=b.dy;if(b.x<8||b.x>592)b.dx*=-1;if(b.y<8)b.dy*=-1;if(b.y>535&&b.y<560&&b.x>arkP.x-45&&b.x<arkP.x+45)b.dy=-Math.abs(b.dy);for(var i=0;i<arkBricks.length;i++){var q=arkBricks[i];if(q.a&&Math.abs(b.x-q.x)<30&&Math.abs(b.y-q.y)<15){q.a=false;b.dy*=-1;arkScore++;document.getElementById('arkanoidScore').textContent=arkScore;break}}if(b.y>620||arkBricks.every(function(q){return !q.a})){startArkanoid();return}drawArkanoid()}function drawArkanoid(){var c=document.getElementById('arkanoidCanvas'),x=c.getContext('2d');x.fillStyle='#101315';x.fillRect(0,0,600,600);x.fillStyle='#d86c61';arkBricks.forEach(function(q){if(q.a)x.fillRect(q.x-27,q.y-10,54,20)});x.fillStyle='#63b878';x.fillRect(arkP.x-45,555,90,14);x.fillStyle='#ffe28a';x.beginPath();x.arc(arkBall.x,arkBall.y,7,0,Math.PI*2);x.fill()}document.querySelectorAll('[data-ark]').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();moveArk(b.dataset.ark==='left'?-1:1)})});var pongTimer,pongPaused=false,pong={x:300,y:300,dx:4,dy:3},pongPlayer=260,pongAI=260,pongMe=0,pongEnemy=0;function startPong(){clearInterval(pongTimer);pongPaused=false;pong={x:300,y:300,dx:4,dy:3};pongPlayer=260;pongAI=260;pongMe=0;pongEnemy=0;document.getElementById('pongScore').textContent='0 : 0';drawPong();pongTimer=setInterval(pongStep,25)}function togglePongPause(){if(activeGame!=='pong')return;pongPaused=!pongPaused}function movePong(d){if(!pongPaused)pongPlayer=Math.max(45,Math.min(555,pongPlayer+d*25))}function pongStep(){if(pongPaused)return;var b=pong;b.x+=b.dx;b.y+=b.dy;if(b.y<10||b.y>590)b.dy*=-1;if(b.x<35&&Math.abs(b.y-pongPlayer)<65)b.dx=Math.abs(b.dx);if(b.x>565&&Math.abs(b.y-pongAI)<65)b.dx=-Math.abs(b.dx);pongAI+=(b.y-pongAI)*.06;if(b.x<0){pongEnemy++;pong={x:300,y:300,dx:4,dy:3}}if(b.x>600){pongMe++;pong={x:300,y:300,dx:-4,dy:3}}document.getElementById('pongScore').textContent=pongMe+' : '+pongEnemy;drawPong()}function drawPong(){var c=document.getElementById('pongCanvas'),x=c.getContext('2d');x.fillStyle='#101315';x.fillRect(0,0,600,600);x.strokeStyle='#555';x.setLineDash([10,12]);x.beginPath();x.moveTo(300,0);x.lineTo(300,600);x.stroke();x.setLineDash([]);x.fillStyle='#63b878';x.fillRect(20,pongPlayer-65,15,130);x.fillStyle='#d86c61';x.fillRect(565,pongAI-65,15,130);x.fillStyle='#ffe28a';x.beginPath();x.arc(pong.x,pong.y,9,0,Math.PI*2);x.fill()}document.querySelectorAll('[data-pong]').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();movePong(b.dataset.pong==='up'?-1:1)})});'''
          assert s.count(marker)==1
          s=s.replace(marker,addjs+marker,1)
          old="""else if(activeGame==='racing'){if(e.code==='Space'){e.preventDefault();toggleRacingPause();return}if(e.code==='ArrowLeft'){e.preventDefault();moveRacing(-1)}if(e.code==='ArrowRight'){e.preventDefault();moveRacing(1)}}"""
          new="""else if(activeGame==='racing'){if(e.code==='Space'){e.preventDefault();toggleRacingPause();return}if(e.code==='ArrowLeft'){e.preventDefault();moveRacing(-1)}if(e.code==='ArrowRight'){e.preventDefault();moveRacing(1)}if(e.code==='ArrowDown'){e.preventDefault();racingBrake=!racingBrake}}else if(activeGame==='arkanoid'){if(e.code==='Space'){e.preventDefault();toggleArkanoidPause();return}if(e.code==='ArrowLeft'){e.preventDefault();moveArk(-1)}if(e.code==='ArrowRight'){e.preventDefault();moveArk(1)}}else if(activeGame==='pong'){if(e.code==='Space'){e.preventDefault();togglePongPause();return}if(e.code==='ArrowUp'){e.preventDefault();movePong(-1)}if(e.code==='ArrowDown'){e.preventDefault();movePong(1)}}"""
          assert old in s
          s=s.replace(old,new,1)
          old="""function stopAllGames(){clearInterval(snakeTimer);stopTanks();clearInterval(tetrisTimer);clearInterval(racingTimer);clearInterval(shooterTimer);clearInterval(frogTimer)}"""
          new="""function stopAllGames(){clearInterval(snakeTimer);stopTanks();clearInterval(tetrisTimer);clearInterval(racingTimer);clearInterval(shooterTimer);clearInterval(frogTimer);clearInterval(arkTimer);clearInterval(pongTimer)}"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('games.html patched:',len(s))
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.html
          git rm .github/workflows/apply-games-update.yml
          git commit -m "Update games collection and improve Tetris borders"
          git push
