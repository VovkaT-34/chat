name: Stabilize Glaz Boga RAM and deep search
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and RAM refresh
        shell: python
        run: |
          from pathlib import Path
          import re

          backend = Path('osint-backend/main.py')
          s = backend.read_text(encoding='utf-8')

          old_memory = '''@app.get("/memory")
          def memory():
              """Return the current process RSS in megabytes for the lightweight UI indicator."""
              rss_kb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
              return {
                  "ram_mb": round(rss_kb / 1024, 1),
                  "unit": "MB RAM",
              }
          '''
          new_memory = '''@app.get("/memory")
          def memory():
              """Return current process RSS in megabytes for the lightweight UI indicator."""
              try:
                  with open("/proc/self/statm", "r", encoding="utf-8") as fh:
                      pages = int(fh.read().split()[1])
                  rss_mb = pages * resource.getpagesize() / (1024 * 1024)
              except Exception:
                  rss_kb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
                  rss_mb = rss_kb / 1024
              return {
                  "ram_mb": round(rss_mb, 1),
                  "unit": "MB RAM",
              }
          '''
          if old_memory in s:
              s = s.replace(old_memory, new_memory, 1)
          else:
              pattern = r'@app\.get\("/memory"\)\ndef memory\(\):.*?\n\n\nasync def run_username_job'
              replacement = new_memory + '\n\n\nasync def run_username_job'
              s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('memory endpoint pattern not found')

          s = s.replace('BATCH_SIZE = 10', 'BATCH_SIZE = 5', 1)
          s = s.replace('MAX_CONNECTIONS = 4', 'MAX_CONNECTIONS = 2', 1)
          s = s.replace('REQUEST_TIMEOUT = 3', 'REQUEST_TIMEOUT = 2', 1)

          old_block = '''                results = await maigret_search(
                    username=query,
                    site_dict=batch,
                    logger=logger,
                    timeout=REQUEST_TIMEOUT,
                    is_parsing_enabled=False,
                    max_connections=MAX_CONNECTIONS,
                    no_progressbar=True,
                )'''
          new_block = '''                try:
                    results = await asyncio.wait_for(
                        maigret_search(
                            username=query,
                            site_dict=batch,
                            logger=logger,
                            timeout=REQUEST_TIMEOUT,
                            is_parsing_enabled=False,
                            max_connections=MAX_CONNECTIONS,
                            no_progressbar=True,
                        ),
                        timeout=18,
                    )
                except asyncio.TimeoutError:
                    job["checked"] = min(offset + len(batch), len(items))
                    job["checked_items"] = (
                        job["checked_items"]
                        + [f"Пакет {offset + 1}–{offset + len(batch)}: таймаут, продолжаем"]
                    )[-20:]
                    await asyncio.sleep(0)
                    continue'''
          if old_block not in s:
              raise SystemExit('deep Maigret block not found')
          s = s.replace(old_block, new_block, 1)

          backend.write_text(s, encoding='utf-8')

          html = Path('game-glaz-boga.html')
          h = html.read_text(encoding='utf-8')
          h = h.replace("const start=()=>{update();setInterval(update,2500)};", "const start=()=>{let timer=null;const tick=async()=>{await update();timer=setTimeout(tick,2500)};tick();};", 1)
          html.write_text(h, encoding='utf-8')
          Path('.github/workflows/.stabilize-trigger').write_text('2\n', encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osint-backend/main.py game-glaz-boga.html .github/workflows/stabilize-glaz-search.yml .github/workflows/.stabilize-trigger
          git commit -m "Stabilize RAM refresh and deep Maigret search"
          git rm .github/workflows/stabilize-glaz-search.yml .github/workflows/.stabilize-trigger
          git commit -m "Remove one-shot Glaz Boga stabilization workflow"
          git push
# trigger