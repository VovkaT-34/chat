name: Build Airplanes 5

on:
  push:
    branches: [main]
    paths:
      - 'airplanes5/**'
      - 'game-airplanes2.*'
      - '.github/workflows/build-airplanes5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chat
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Fetch original Airplanes
        run: git clone --depth 1 https://github.com/m110/airplanes.git /tmp/airplanes

      - name: Apply mobile controls patch
        run: |
          cp airplanes5/controls.go /tmp/airplanes/system/controls.go
          python3 airplanes5/patch-game.py
          mkdir -p airplanes5
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" airplanes5/wasm_exec.js
          cd /tmp/airplanes
          GOOS=js GOARCH=wasm go build -o "$GITHUB_WORKSPACE/airplanes5/game.wasm" .

      - name: Commit generated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airplanes5/game.wasm airplanes5/wasm_exec.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: update Airplanes 5 mobile game [skip ci]"
          git push
