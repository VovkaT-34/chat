name: Build Airplanes 5

on:
  push:
    branches: [main]
    paths:
      - 'airplanes5/**'
      - 'game-airplanes2.*'
      - '.github/workflows/build-airplanes5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chat
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Fetch original Airplanes
        run: git clone --depth 1 https://github.com/m110/airplanes.git /tmp/airplanes

      - name: Apply mobile controls patch
        run: |
          echo ' func(entry *donburi.Entry) {' | base64 -d > /tmp/airplanes/system/controls.go
          python3 -c "from pathlib import Path; p=Path('/tmp/airplanes/scene/game.go'); s=p.read_text(); old='\\tif inpututil.IsKeyJustPressed(ebiten.KeyEscape) {\\n\\t\\tgameData.Paused = !gameData.Paused\\n\\t}\\n'; new=old+'\\n\\tjustPressed := inpututil.AppendJustPressedTouchIDs(nil)\\n\\tfor _, id := range justPressed {\\n\\t\\tx, y := ebiten.TouchPosition(id)\\n\\t\\tif x >= 150 && x < 330 && y >= 520 && y < 600 {\\n\\t\\t\\tgameData.Paused = !gameData.Paused\\n\\t\\t\\tbreak\\n\\t\\t}\\n\\t}\\n'; assert old in s, 'pause insertion point not found'; p.write_text(s.replace(old,new,1))"
          mkdir -p airplanes5
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" airplanes5/wasm_exec.js
          cd /tmp/airplanes
          GOOS=js GOARCH=wasm go build -o "$GITHUB_WORKSPACE/airplanes5/game.wasm" .

      - name: Commit generated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airplanes5/game.wasm airplanes5/wasm_exec.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: update Airplanes 5 mobile game [skip ci]"
          git push
