name: One-time stop deep search
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('osint-backend/main.py')
          s=p.read_text()
          s=s.replace('DEEP_JOBS = {}\nACTIVE_DEEP_JOB_ID = None', 'DEEP_JOBS = {}\nDEEP_TASKS = {}\nACTIVE_DEEP_JOB_ID = None')
          old='''    DEEP_JOBS[job_id] = {"type": kind, "kind": kind, "query": query, "job_id": job_id, "status": "queued", "total": 0, "checked": 0, "count": 0, "results": [], "checked_items": [], "error": None, "finished_at": None}\n    ACTIVE_DEEP_JOB_ID = job_id\n    asyncio.create_task(run_deep_job(job_id, kind, query))\n    return DEEP_JOBS[job_id]'''
          new='''    DEEP_JOBS[job_id] = {"type": kind, "kind": kind, "query": query, "job_id": job_id, "status": "queued", "total": 0, "checked": 0, "count": 0, "results": [], "checked_items": [], "error": None, "finished_at": None}\n    ACTIVE_DEEP_JOB_ID = job_id\n    DEEP_TASKS[job_id] = asyncio.create_task(run_deep_job(job_id, kind, query))\n    return DEEP_JOBS[job_id]'''
          if old not in s: raise SystemExit('backend start snippet not found')
          s=s.replace(old,new)
          old='''@app.get("/deep/status")\ndef deep_status(job_id: str = Query(min_length=8, max_length=64)):\n    cleanup_deep_jobs()\n    job = DEEP_JOBS.get(job_id)\n    if not job:\n        raise HTTPException(status_code=404, detail="Глубокое задание не найдено или уже удалено")\n    return job\n'''
          new='''@app.get("/deep/status")\ndef deep_status(job_id: str = Query(min_length=8, max_length=64)):\n    cleanup_deep_jobs()\n    job = DEEP_JOBS.get(job_id)\n    if not job:\n        raise HTTPException(status_code=404, detail="Глубокое задание не найдено или уже удалено")\n    return job\n\n\n@app.get("/deep/cancel")\nasync def deep_cancel(job_id: str = Query(min_length=8, max_length=64)):\n    global ACTIVE_DEEP_JOB_ID\n    cleanup_deep_jobs()\n    job = DEEP_JOBS.get(job_id)\n    if not job:\n        raise HTTPException(status_code=404, detail="Глубокое задание не найдено или уже удалено")\n    if job["status"] in {"done", "error", "cancelled"}:\n        return job\n    job["status"] = "cancelled"\n    job["error"] = None\n    job["finished_at"] = time.time()\n    task = DEEP_TASKS.get(job_id)\n    if task and not task.done():\n        task.cancel()\n    DEEP_TASKS.pop(job_id, None)\n    if ACTIVE_DEEP_JOB_ID == job_id:\n        ACTIVE_DEEP_JOB_ID = None\n    return job\n'''
          if old not in s: raise SystemExit('backend status snippet not found')
          s=s.replace(old,new)
          old='''        if ACTIVE_DEEP_JOB_ID == job_id:\n            ACTIVE_DEEP_JOB_ID = None\n\n\n@app.get("/deep")'''
          new='''        if ACTIVE_DEEP_JOB_ID == job_id:\n            ACTIVE_DEEP_JOB_ID = None\n        DEEP_TASKS.pop(job_id, None)\n\n\n@app.get("/deep")'''
          if old not in s: raise SystemExit('backend finally snippet not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('game-glaz-boga.html')
          s=p.read_text()
          s=s.replace('.search-title{font-size:19px;margin:0 0 7px}', '.search-title{font-size:19px;margin:0 0 7px}.search-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stop-deep{display:none;border:1px solid rgba(255,110,110,.45);background:rgba(160,45,65,.35);color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer}.stop-deep.active{display:inline-block}.deep-running{display:none;margin:0 0 10px;color:#f0a5bd;font-size:12px}.deep-running.active{display:block}')
          s=s.replace('<h2 class="search-title">🔎 Глубокий поиск</h2>', '<div class="search-title-row"><h2 class="search-title">🔎 Глубокий поиск</h2><button id="stopDeep" class="stop-deep" onclick="stopDeepSearch()">■ Стоп</button></div><div id="deepRunning" class="deep-running">● Поиск выполняется — его можно остановить кнопкой «Стоп».</div>')
          s=s.replace('deepSites=document.getElementById(\'deepSites\');let currentType=\'all\',deepTimer=null,deepJobId=null;', 'deepSites=document.getElementById(\'deepSites\'),stopDeep=document.getElementById(\'stopDeep\'),deepRunning=document.getElementById(\'deepRunning\');let currentType=\'all\',deepTimer=null,deepJobId=null;')
          old='''if(d.status==='done'||d.status==='error'){clearInterval(deepTimer);deepTimer=null}}catch(e){deepStatus.textContent='Статус: ожидание связи с Render…'}}async function deepSearch()'''
          new='''if(d.status==='done'||d.status==='error'||d.status==='cancelled'){clearInterval(deepTimer);deepTimer=null;stopDeep.classList.remove('active');deepRunning.classList.remove('active')}}catch(e){deepStatus.textContent='Статус: ожидание связи с Render…'}}async function stopDeepSearch(){if(!deepJobId)return;stopDeep.disabled=true;deepStatus.textContent='Статус: остановка…';try{const r=await fetch(RENDER+'/deep/cancel?job_id='+encodeURIComponent(deepJobId),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.detail||'HTTP '+r.status);clearInterval(deepTimer);deepTimer=null;renderDeep(d);stopDeep.classList.remove('active');deepRunning.classList.remove('active')}catch(e){deepStatus.textContent='Статус: ошибка остановки — '+e.message}finally{stopDeep.disabled=false}}async function deepSearch()'''
          if old not in s: raise SystemExit('ui poll snippet not found')
          s=s.replace(old,new)
          old='''deepProgress.style.display='block';deepQuery.textContent=deepLabel(kind)+': '+value;deepStatus.textContent='Статус: запуск…';deepChecked.textContent='Проверено: 0 / …';deepFound.textContent='Найдено: 0';deepSites.innerHTML='';'''
          new='''deepProgress.style.display='block';deepQuery.textContent=deepLabel(kind)+': '+value;deepStatus.textContent='Статус: запуск…';deepChecked.textContent='Проверено: 0 / …';deepFound.textContent='Найдено: 0';deepSites.innerHTML='';stopDeep.classList.remove('active');deepRunning.classList.remove('active');'''
          if old not in s: raise SystemExit('ui deep start snippet not found')
          s=s.replace(old,new)
          old='''deepJobId=d.job_id;renderDeep(d);if(d.status!=='done'&&d.status!=='error'){await pollDeep();deepTimer=setInterval(pollDeep,4000)}}catch(e){deepStatus.textContent='Статус: ошибка запуска — '+e.message}}'''
          new='''deepJobId=d.job_id;renderDeep(d);if(d.status!=='done'&&d.status!=='error'&&d.status!=='cancelled'){stopDeep.classList.add('active');deepRunning.classList.add('active');await pollDeep();deepTimer=setInterval(pollDeep,4000)}}catch(e){stopDeep.classList.remove('active');deepRunning.classList.remove('active');deepStatus.textContent='Статус: ошибка запуска — '+e.message}}'''
          if old not in s: raise SystemExit('ui deep job snippet not found')
          s=s.replace(old,new)
          s=s.replace("d.status==='error'?'ошибка':d.status", "d.status==='error'?'ошибка':d.status==='cancelled'?'остановлен':d.status")
          p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-glaz-boga.html osint-backend/main.py
          git commit -m "Add stop control for deep OSINT search"
          git rm .github/workflows/one-time-stop-deep.yml
          git commit -m "Remove one-time patch workflow"
          git push
