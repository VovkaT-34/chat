name: One-off games mobile update
on:
  push:
    paths:
      - '.github/workflows/_oneoff_games_mobile.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch games.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.controls{width:min(320px,100%);margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ctrl{height:56px;', '.controls{width:min(320px,100%);margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mobile-pause{display:none}.ctrl{height:56px;')
          s=s.replace('.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}', '.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.pause{grid-column:2;grid-row:1}')
          s=s.replace('.controls{width:min(340px,100%)}}', '.controls{width:min(340px,100%)}.mobile-pause{display:block}.pause{grid-column:2;grid-row:1}.up{grid-column:2;grid-row:2}.left{grid-column:1;grid-row:3}.down{grid-column:2;grid-row:3}.right{grid-column:3;grid-row:3}}')
          s=s.replace('<div class="controls"><button class="ctrl up" data-dir="up">▲</button>', '<div class="controls"><button class="ctrl mobile-pause pause" onclick="toggleSnakePause()">Пауза</button><button class="ctrl up" data-dir="up">▲</button>')
          s=s.replace("var snakeTimer,snake=[],snakeDir={x:1,y:0},snakeNext={x:1,y:0},snakeFood={x:18,y:18},snakeScore=0,snakeSpeed=300,snakePaused=false;", "var snakeTimer,snake=[],snakeDir={x:1,y:0},snakeNext={x:1,y:0},snakeFood={x:18,y:18},snakeScore=0,snakeSpeed=300,snakePaused=false,snakeGridSize=window.matchMedia('(max-width:700px)').matches?26:36;")
          s=s.replace("snakeFood={x:Math.floor(Math.random()*36),y:Math.floor(Math.random()*36)}", "snakeFood={x:Math.floor(Math.random()*snakeGridSize),y:Math.floor(Math.random()*snakeGridSize)}")
          s=s.replace("h.x>=36||h.y>=36", "h.x>=snakeGridSize||h.y>=snakeGridSize")
          s=s.replace("var c=document.getElementById('snakeCanvas'),x=c.getContext('2d'),s=10;x.clearRect(0,0,360,360);", "var c=document.getElementById('snakeCanvas'),x=c.getContext('2d'),s=360/snakeGridSize;x.clearRect(0,0,360,360);")
          s=s.replace("x.fillRect(snakeFood.x*s+1,snakeFood.y*s+1,8,8);snake.forEach", "x.fillRect(snakeFood.x*s+1,snakeFood.y*s+1,Math.max(2,s-2),Math.max(2,s-2));snake.forEach")
          s=s.replace("x.fillRect(p.x*s+1,p.y*s+1,8,8)", "x.fillRect(p.x*s+1,p.y*s+1,Math.max(2,s-2),Math.max(2,s-2))")
          s=s.replace("var activeGame=null;", "var activeGame=null;\nwindow.addEventListener('resize',function(){snakeGridSize=window.matchMedia('(max-width:700px)').matches?26:36;if(activeGame==='snake'){drawSnake()}});")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games.html .github/workflows/_oneoff_games_mobile.yml
          git rm .github/workflows/_oneoff_games_mobile.yml
          git commit -m 'Adjust Snake mobile grid and add pause button'
          git push
