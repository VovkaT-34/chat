name: Fix Glaz Boga RAM indicator
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game-glaz-boga.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('game-glaz-boga.html')
          s = p.read_text(encoding='utf-8')
          marker = '<span id="osintRamIndicator" class="osint-ram-indicator">ОЗУ: — MB</span>'
          if marker not in s:
              s = s.replace(
                  '<h2 class="search-title">🔎 Глубокий поиск</h2>',
                  '<h2 class="search-title">🔎 Глубокий поиск</h2>\n' + marker,
                  1
              )
          css = '.osint-ram-indicator{display:inline-flex;align-items:center;margin-left:auto;padding:3px 8px;border:1px solid rgba(57,229,140,.45);border-radius:8px;background:rgba(57,229,140,.10);color:#39e58c;font-size:12px;font-weight:800;line-height:1.35;white-space:nowrap;visibility:visible;opacity:1;position:relative;z-index:9999;flex:0 0 auto}'
          if '.osint-ram-indicator{' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          script = '''<script>\n(function(){\n  const update=async()=>{const el=document.getElementById('osintRamIndicator');if(!el)return;try{const r=await fetch('https://glaz-boga-osint.onrender.com/memory?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();const n=Number(d.ram_mb);if(Number.isFinite(n))el.textContent='ОЗУ: '+n.toFixed(1)+' MB';}catch(e){}};\n  const start=()=>{update();setInterval(update,2500)};\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();\n})();\n</script>'''
          if 'glazRamDirectFix' not in s:
              script = script.replace('<script>', '<script id="glazRamDirectFix">', 1)
              s = s.replace('</head>', script + '</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove this one-shot workflow
        run: rm -f .github/workflows/fix-glaz-ram.yml
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-glaz-boga.html .github/workflows/fix-glaz-ram.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix visible RAM indicator in Glaz Boga"
          git push