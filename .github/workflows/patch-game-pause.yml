name: Patch game pause controls
on:
  push:
    paths:
      - '.github/workflows/patch-game-pause.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch games.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('games.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=re.sub(r'<button class="mobile-pause[^>]*>.*?</button>', '', s, flags=re.S)
          marker='</script>'
          patch="""\n<script>\n(function(){\n  var pauseAreas={\n    snakeCanvas:'toggleSnakePause',\n    tankBoard:'toggleTankPause',\n    tetrisCanvas:'toggleTetrisPause',\n    racingCanvas:'toggleRacingPause',\n    shooterCanvas:'toggleShooterPause',\n    froggerCanvas:'toggleFroggerPause',\n    arkanoidCanvas:'toggleArkanoidPause',\n    pongCanvas:'togglePongPause'\n  };\n  Object.keys(pauseAreas).forEach(function(id){\n    var el=document.getElementById(id), fn=pauseAreas[id];\n    if(!el)return;\n    el.addEventListener('click',function(){\n      if(activeGame===id.replace('Canvas','').replace('Board','')) window[fn]();\n    });\n  });\n})();\n</script>\n"""
          s=s.replace(marker,patch+marker,1)
          if s==old:
              raise SystemExit('No changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.html
          git commit -m "Move game pause to game screen"
          git rm .github/workflows/patch-game-pause.yml
          git commit -m "Remove temporary game pause workflow"
          git push