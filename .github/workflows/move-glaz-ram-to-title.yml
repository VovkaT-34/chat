name: Move Glaz Boga RAM indicator to title
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move RAM indicator beside title
        shell: python
        run: |
          from pathlib import Path
          p = Path('game-glaz-boga.html')
          s = p.read_text(encoding='utf-8')
          marker = '<span id="osintRamIndicator" class="osint-ram-indicator">ОЗУ: — MB</span>'
          s = s.replace('\n' + marker, '', 1)
          title = '<h1 class="title">👁️ Глаз Бога</h1>'
          if marker not in s:
              s = s.replace(title, title + marker, 1)
          s = s.replace('margin-left:auto;padding:3px 8px;border:1px solid rgba(57,229,140,.45)', 'margin-left:10px;padding:3px 8px;border:1px solid rgba(57,229,140,.45)', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit HTML and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-glaz-boga.html .github/workflows/move-glaz-ram-to-title.yml
          git commit -m "Move RAM indicator beside Glaz Boga title"
          git rm .github/workflows/move-glaz-ram-to-title.yml
          git commit -m "Remove one-shot RAM title workflow"
          git push
