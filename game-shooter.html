<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>🔫 Стрелялка</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="game-shooter.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="auth-check.js"></script>
</head>
<body>
  <div class="page">
    <div class="top">
      <button class="back" onclick="location.href='games.html'">← Игры</button>
      <h1 class="title">🔫 Стрелялка</h1>
      <span id="shooterScore" class="score">0</span>
    </div>
    <canvas id="shooterCanvas" class="shooter-canvas" width="600" height="600"></canvas>
    <div class="game-controls-wide">
      <div class="wide-grid">
        <button class="mobile-pause pause-btn" onclick="toggleShooterPause()">Пауза</button>
        <button class="game-btn" data-shoot="left">◀</button>
        <button class="game-btn" data-shoot="fire">●</button>
        <button class="game-btn" data-shoot="right">▶</button>
      </div>
    </div>
    <p class="hint desktop-hint">Компьютер: ← → движение · Пробел — огонь · P — пауза</p>
  </div>
  <script>var activeGame='shooter';</script>
  <script src="game-shooter.js"></script>
  <script>startShooter();document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();fireShooter()}if(e.code==='KeyP'){e.preventDefault();toggleShooterPause()}if(e.code==='ArrowLeft'){e.preventDefault();moveShooter(-1)}if(e.code==='ArrowRight'){e.preventDefault();moveShooter(1)}});</script>
<script src="game-navigation.js"></script>
</body>
</html>
