<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>🏎️ Гонки</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="game-racing.css">
</head>
<body>
<div class="page">
  <div class="top">
    <button class="back" onclick="location.href='games.html'">← Игры</button>
    <h1 class="title">🏎️ Гонки</h1>
    <span id="racingScore" class="score">0</span>
  </div>
  <canvas id="racingCanvas" class="racing-canvas" width="600" height="600"></canvas>
  <div class="game-controls-wide"><div class="wide-grid">
    <button class="mobile-pause pause-btn" onclick="toggleRacingPause()">Пауза</button>
    <button class="game-btn" data-race="left">◀</button>
    <button class="game-btn" data-race="right">▶</button>
  </div></div>
  <p class="hint desktop-hint">Компьютер: ← → управление · Пробел — пауза</p>
</div>
<script>var activeGame='racing';</script>
<script src="game-racing.js"></script>
<script>startRacing();document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();toggleRacingPause();return}if(e.code==='ArrowLeft'){e.preventDefault();moveRacing(-1)}if(e.code==='ArrowRight'){e.preventDefault();moveRacing(1)}if(e.code==='ArrowDown'){e.preventDefault();racingBrake=!racingBrake}});</script>
</body>
</html>
